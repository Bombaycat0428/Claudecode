<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BINGO — ビンゴカード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --twilight-a: hsl(240 86% 34%);
    --twilight-b: hsl(285 90% 46%);
    --twilight-c: hsl(334 100% 58%);
    --ink: #f7f3fc;
    --ink-soft: rgba(247, 243, 252, 0.68);
    --glass: rgba(255, 255, 255, 0.12);
    --glass-edge: rgba(255, 255, 255, 0.28);
    --cell: rgba(255, 255, 255, 0.09);
    --cell-edge: rgba(255, 255, 255, 0.18);
    --accent: #ff8a65;
    --accent-soft: rgba(255, 138, 101, 0.2);
    --gold: #f2c14e;
    --gold-soft: rgba(242, 193, 78, 0.25);
    --reach: rgba(255, 138, 101, 0.6);
    --chip-ink: #2b3440;
    --chip-ink-soft: rgba(43, 52, 64, 0.6);
    --accent-dark: #e0705f;
    --gold-dark: #c8912e;
  }

  * { box-sizing: border-box; }

  html, body { min-height: 100%; margin: 0; }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px 16px;
    background:
      radial-gradient(ellipse 80% 55% at 50% 0%, rgba(255, 255, 255, 0.16), transparent 65%),
      linear-gradient(180deg, var(--twilight-a), var(--twilight-b), var(--twilight-c));
    color: var(--ink);
    font-family: "Space Grotesk", "Noto Sans JP", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  .scene {
    position: relative;
    z-index: 1;
    width: min(440px, 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }

  header {
    text-align: center;
    line-height: 1;
  }

  h1 {
    margin: 0;
    font-size: clamp(34px, 9vw, 44px);
    font-weight: 700;
    letter-spacing: 0.34em;
    margin-right: -0.34em; /* letter-spacing分の右寄り補正 */
    color: var(--ink);
  }

  h1 .o { color: var(--accent); }

  .subtitle {
    margin-top: 8px;
    font-family: "Noto Sans JP", sans-serif;
    font-size: 12px;
    letter-spacing: 0.3em;
    margin-right: -0.3em;
    color: var(--ink-soft);
  }

  .card {
    width: 100%;
    padding: clamp(12px, 4vw, 20px);
    border-radius: 24px;
    background: var(--glass);
    border: 1px solid var(--glass-edge);
    backdrop-filter: blur(14px);
    box-shadow:
      0 24px 50px -24px rgba(8, 4, 26, 0.4),
      inset 0 1px 0 rgba(255, 255, 255, 0.25);
    animation: card-in 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) both;
  }

  @keyframes card-in {
    from { opacity: 0; transform: translateY(14px) scale(0.98); }
    to   { opacity: 1; transform: none; }
  }

  .letters, .grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: clamp(6px, 1.8vw, 10px);
  }

  .letters {
    margin-bottom: clamp(6px, 1.8vw, 10px);
  }

  .letters span {
    text-align: center;
    font-weight: 700;
    font-size: clamp(16px, 4.5vw, 20px);
    letter-spacing: 0.05em;
    color: var(--ink-soft);
    padding: 4px 0;
  }

  .letters span:last-child { color: var(--accent); }

  .cell {
    position: relative;
    aspect-ratio: 1;
    border: none;
    border-radius: 16px;
    background: none;
    padding: 0;
    cursor: pointer;
    user-select: none;
    perspective: 240px;
    animation: cell-in 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) both;
    animation-delay: calc(var(--i) * 14ms);
  }

  @keyframes cell-in {
    from { opacity: 0; transform: scale(0.85); }
    to   { opacity: 1; transform: none; }
  }

  .cell:hover .flap { transform: translateY(-2px); }
  .cell:active .flap { transform: scale(0.94); }

  /* 穴：数字が倒れて消えた後に見える奥のくぼみ */
  .cell .hole {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 16px;
    background: rgba(10, 4, 28, 0.4);
    border: 1px solid var(--accent);
    box-shadow:
      inset 0 12px 18px -6px rgba(0, 0, 0, 0.65),
      inset 0 2px 5px rgba(0, 0, 0, 0.4),
      0 0 0 1px rgba(255, 138, 101, 0.18);
    z-index: 0;
    opacity: 0;
    transition: opacity 0.25s ease 0.14s;
  }

  .cell .hole b {
    font-family: "IBM Plex Mono", monospace;
    font-size: clamp(15px, 4.2vw, 19px);
    font-weight: 600;
    color: var(--accent);
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
  }

  .cell.marked:not(.free) .hole { opacity: 1; }

  .cell.line .hole b { color: var(--gold); }

  /* フラップ：数字が書かれた板。後ろへパタンと倒れて奥の穴を見せる */
  .cell .flap {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--cell-edge);
    border-radius: 16px;
    background: var(--cell);
    font-family: "IBM Plex Mono", monospace;
    font-size: clamp(16px, 4.6vw, 21px);
    font-weight: 600;
    color: var(--ink);
    text-shadow: 0 1px 3px rgba(8, 4, 26, 0.75), 0 0 8px rgba(8, 4, 26, 0.35);
    z-index: 1;
    transform-style: preserve-3d;
    transform-origin: 50% 100%;
    backface-visibility: hidden;
    box-shadow: 0 3px 8px -3px rgba(8, 4, 26, 0.35);
    transition: transform 0.5s cubic-bezier(0.5, 0, 0.42, 1.35), opacity 0.4s ease, box-shadow 0.3s ease;
  }

  .cell.marked:not(.free) .flap {
    transform: rotateX(100deg);
    opacity: 0;
    box-shadow: none;
  }

  .cell.free .flap {
    position: relative;
    font-family: "Space Grotesk", sans-serif;
    font-size: clamp(11px, 3vw, 13px);
    letter-spacing: 0.12em;
    cursor: default;
    background: var(--gold);
    border-color: var(--gold);
    color: #fff;
  }

  /* リーチ：あと1つのマス */
  .cell.hot:not(.marked) .flap {
    border-color: var(--reach);
    box-shadow: 0 0 0 1px var(--reach), 0 0 18px -4px var(--reach);
    animation: hot-pulse 1.6s ease-in-out infinite;
  }

  @keyframes hot-pulse {
    0%, 100% { box-shadow: 0 0 0 1px var(--reach), 0 0 14px -6px var(--reach); }
    50%      { box-shadow: 0 0 0 1px var(--reach), 0 0 22px -2px var(--reach); }
  }

  /* 揃ったライン上のマス */
  .cell.line .hole {
    border-color: var(--gold);
  }

  .status {
    display: flex;
    align-items: center;
    gap: 14px;
    font-family: "Noto Sans JP", sans-serif;
    font-size: 13px;
    color: var(--ink-soft);
    min-height: 20px;
  }

  .status .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 12px;
    border-radius: 999px;
    background: #ffffff;
    border: 1px solid rgba(43, 52, 64, 0.08);
    box-shadow: 0 10px 20px -14px rgba(8, 4, 26, 0.4);
    color: var(--chip-ink-soft);
  }

  .status .chip b {
    font-family: "IBM Plex Mono", monospace;
    font-weight: 600;
    color: var(--chip-ink);
  }

  .status .chip.reach-on b { color: var(--accent-dark); }
  .status .chip.bingo-on { border-color: var(--gold-dark); }
  .status .chip.bingo-on b { color: var(--gold-dark); }

  .new-card {
    appearance: none;
    border: 1px solid rgba(43, 52, 64, 0.08);
    border-radius: 999px;
    padding: 10px 26px;
    background: #ffffff;
    font-family: "Noto Sans JP", sans-serif;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.1em;
    color: var(--chip-ink);
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.2s ease;
    box-shadow: 0 10px 24px -14px rgba(8, 4, 26, 0.4);
  }

  .new-card:hover { transform: translateY(-1px); box-shadow: 0 14px 28px -14px rgba(8, 4, 26, 0.45); }
  .new-card:active { transform: scale(0.97); }

  /* ビンゴ演出 */
  .flash {
    position: fixed;
    inset: 0;
    z-index: 8;
    pointer-events: none;
    opacity: 0;
    background: radial-gradient(circle at 50% 42%, rgba(255, 255, 255, 0.95), rgba(242, 193, 78, 0.35) 32%, transparent 68%);
  }

  .flash.show { animation: flash-pop 0.7s ease-out both; }

  @keyframes flash-pop {
    0%   { opacity: 0; }
    12%  { opacity: 1; }
    100% { opacity: 0; }
  }

  .scene.shake { animation: shake 0.5s cubic-bezier(0.36, 0.07, 0.19, 0.97) both; }

  @keyframes shake {
    10%, 90% { transform: translate3d(-1px, 0, 0) rotate(-0.3deg); }
    20%, 80% { transform: translate3d(2px, 0, 0) rotate(0.3deg); }
    30%, 50%, 70% { transform: translate3d(-4px, 0, 0) rotate(-0.6deg); }
    40%, 60% { transform: translate3d(4px, 0, 0) rotate(0.6deg); }
    100% { transform: translate3d(0, 0, 0) rotate(0); }
  }

  .banner {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    opacity: 0;
    z-index: 10;
  }

  .banner.show { animation: banner 2.6s cubic-bezier(0.2, 0.8, 0.2, 1) both; }

  .banner span {
    position: relative;
    font-size: clamp(58px, 16vw, 100px);
    font-weight: 700;
    letter-spacing: 0.22em;
    margin-right: -0.22em;
    color: var(--gold);
    text-shadow:
      0 0 24px var(--gold),
      0 0 60px var(--gold-soft),
      0 8px 40px rgba(0, 0, 0, 0.35),
      0 2px 0 rgba(255, 255, 255, 0.3);
    animation: banner-glow 1s ease-in-out infinite;
  }

  @keyframes banner-glow {
    0%, 100% {
      text-shadow:
        0 0 20px var(--gold),
        0 0 50px var(--gold-soft),
        0 8px 40px rgba(0, 0, 0, 0.35),
        0 2px 0 rgba(255, 255, 255, 0.3);
    }
    50% {
      text-shadow:
        0 0 34px var(--gold),
        0 0 84px var(--gold-soft),
        0 8px 40px rgba(0, 0, 0, 0.35),
        0 2px 0 rgba(255, 255, 255, 0.3);
    }
  }

  @keyframes banner {
    0%   { opacity: 0; transform: scale(0.35) rotate(-10deg); }
    10%  { opacity: 1; transform: scale(1.18) rotate(4deg); }
    17%  { transform: scale(0.94) rotate(-2deg); }
    24%  { transform: scale(1.05) rotate(1deg); }
    30%  { transform: scale(1) rotate(0deg); }
    85%  { opacity: 1; transform: scale(1) rotate(0deg); }
    100% { opacity: 0; transform: scale(1.1) rotate(0deg); }
  }

  .confetti {
    position: fixed;
    top: -12px;
    width: 8px;
    height: 12px;
    border-radius: 2px;
    pointer-events: none;
    z-index: 9;
    animation: fall linear both;
  }

  .confetti.circle { border-radius: 50%; }
  .confetti.ribbon { width: 5px; height: 18px; border-radius: 3px; }

  @keyframes fall {
    to { transform: translateY(105vh) rotate(var(--spin)); opacity: 0.6; }
  }

  .spark {
    position: fixed;
    left: var(--sx);
    top: var(--sy);
    width: 7px;
    height: 7px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 9;
    animation: spark-burst 900ms cubic-bezier(0.15, 0.6, 0.4, 1) both;
  }

  @keyframes spark-burst {
    0%   { transform: translate(-50%, -50%) translate(0, 0) scale(1); opacity: 1; }
    100% { transform: translate(-50%, -50%) translate(var(--dx), var(--dy)) scale(0.25); opacity: 0; }
  }

  /* 星の瞬き */
  .stars {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }

  .star {
    position: absolute;
    border-radius: 50%;
    background: #fff;
    animation: twinkle linear infinite;
  }

  .star.gold {
    background: var(--gold);
  }

  .star.glow {
    box-shadow: 0 0 6px 1px currentColor;
    color: #fff;
  }

  .star.glow.gold {
    color: var(--gold);
  }

  @keyframes twinkle {
    0%, 100% { opacity: var(--min-o, 0.15); transform: scale(0.7); }
    50% { opacity: var(--max-o, 1); transform: scale(1.2); }
  }
</style>
</head>
<body>
  <div class="stars" id="stars"></div>

  <div class="scene">
    <header>
      <h1>B<span>I</span>NG<span class="o">O</span></h1>
      <div class="subtitle">ビンゴカード</div>
    </header>

    <div class="card">
      <div class="letters"><span>B</span><span>I</span><span>N</span><span>G</span><span>O</span></div>
      <div class="grid" id="grid"></div>
    </div>

    <div class="status">
      <span class="chip" id="reachChip">リーチ <b id="reachCount">0</b></span>
      <span class="chip" id="bingoChip">ビンゴ <b id="bingoCount">0</b></span>
    </div>

    <button class="new-card" id="newCard">新しいカード</button>
  </div>

  <div class="flash" id="flash"></div>
  <div class="banner" id="banner"><span>BINGO!</span></div>

<script>
  const STORAGE_KEY = "bingo-card-v1";
  const FREE = 12;
  const LINES = [];
  for (let r = 0; r < 5; r++) LINES.push([0, 1, 2, 3, 4].map(c => r * 5 + c));
  for (let c = 0; c < 5; c++) LINES.push([0, 1, 2, 3, 4].map(r => r * 5 + c));
  LINES.push([0, 6, 12, 18, 24], [4, 8, 12, 16, 20]);

  const grid = document.getElementById("grid");
  const banner = document.getElementById("banner");
  const flash = document.getElementById("flash");
  const scene = document.querySelector(".scene");
  const reachChip = document.getElementById("reachChip");
  const bingoChip = document.getElementById("bingoChip");

  let cells = [];      // 25個の数字（FREEはnull、行優先）
  let marks = new Set();
  let lastBingo = 0;

  function generateCard() {
    const cols = [];
    for (let c = 0; c < 5; c++) {
      const pool = Array.from({ length: 15 }, (_, i) => c * 15 + i + 1);
      for (let i = pool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }
      cols.push(pool.slice(0, 5));
    }
    cells = [];
    for (let r = 0; r < 5; r++)
      for (let c = 0; c < 5; c++)
        cells.push(r === 2 && c === 2 ? null : cols[c][r]);
    marks = new Set([FREE]);
    lastBingo = 0;
  }

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ cells, marks: [...marks], lastBingo }));
  }

  function load() {
    try {
      const data = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (Array.isArray(data.cells) && data.cells.length === 25) {
        cells = data.cells;
        marks = new Set(data.marks);
        marks.add(FREE);
        lastBingo = data.lastBingo || 0;
        return true;
      }
    } catch (e) {}
    return false;
  }

  function render(initial) {
    grid.innerHTML = "";
    cells.forEach((num, i) => {
      const btn = document.createElement("button");
      btn.className = "cell" + (i === FREE ? " free" : "");
      btn.style.setProperty("--i", initial ? i : 0);

      if (i !== FREE) {
        const hole = document.createElement("span");
        hole.className = "hole";
        const holeNum = document.createElement("b");
        holeNum.textContent = num;
        hole.appendChild(holeNum);
        btn.appendChild(hole);
      }

      const flap = document.createElement("span");
      flap.className = "flap";
      flap.textContent = i === FREE ? "FREE" : num;
      btn.appendChild(flap);

      if (i !== FREE) {
        btn.addEventListener("click", () => {
          marks.has(i) ? marks.delete(i) : marks.add(i);
          update();
          save();
        });
      }
      grid.appendChild(btn);
    });
    update();
  }

  function update() {
    const nodes = grid.children;
    for (let i = 0; i < 25; i++) {
      nodes[i].classList.toggle("marked", marks.has(i));
      nodes[i].classList.remove("hot", "line");
    }

    let reach = 0, bingo = 0;
    for (const line of LINES) {
      const open = line.filter(i => !marks.has(i));
      if (open.length === 0) {
        bingo++;
        line.forEach(i => nodes[i].classList.add("line"));
      } else if (open.length === 1) {
        reach++;
        nodes[open[0]].classList.add("hot");
      }
    }

    document.getElementById("reachCount").textContent = reach;
    document.getElementById("bingoCount").textContent = bingo;
    reachChip.classList.toggle("reach-on", reach > 0);
    bingoChip.classList.toggle("bingo-on", bingo > 0);

    if (bingo > lastBingo) celebrate();
    lastBingo = bingo;
  }

  function celebrate() {
    banner.classList.remove("show");
    void banner.offsetWidth;
    banner.classList.add("show");

    flash.classList.remove("show");
    void flash.offsetWidth;
    flash.classList.add("show");

    scene.classList.remove("shake");
    void scene.offsetWidth;
    scene.classList.add("shake");

    const colors = ["#e0705f", "#f2c14e", "#9ccbd4", "#ffffff", "#c86dd7"];
    const shapes = ["", "circle", "ribbon"];

    for (let i = 0; i < 90; i++) {
      const p = document.createElement("div");
      const shape = shapes[Math.floor(Math.random() * shapes.length)];
      p.className = "confetti" + (shape ? " " + shape : "");
      p.style.left = Math.random() * 100 + "vw";
      p.style.background = colors[i % colors.length];
      p.style.setProperty("--spin", (Math.random() * 900 - 450) + "deg");
      p.style.animationDuration = 1.6 + Math.random() * 1.8 + "s";
      p.style.animationDelay = Math.random() * 0.6 + "s";
      document.body.appendChild(p);
      p.addEventListener("animationend", () => p.remove());
    }

    const cardRect = document.querySelector(".card").getBoundingClientRect();
    const cx = cardRect.left + cardRect.width / 2;
    const cy = cardRect.top + cardRect.height / 2;

    for (let i = 0; i < 50; i++) {
      const s = document.createElement("div");
      s.className = "spark";
      const angle = Math.random() * Math.PI * 2;
      const dist = 120 + Math.random() * 260;
      s.style.setProperty("--sx", cx + "px");
      s.style.setProperty("--sy", cy + "px");
      s.style.setProperty("--dx", Math.cos(angle) * dist + "px");
      s.style.setProperty("--dy", Math.sin(angle) * dist + "px");
      s.style.background = colors[i % colors.length];
      s.style.animationDelay = Math.random() * 0.15 + "s";
      s.style.animationDuration = 700 + Math.random() * 500 + "ms";
      document.body.appendChild(s);
      s.addEventListener("animationend", () => s.remove());
    }
  }

  document.getElementById("newCard").addEventListener("click", () => {
    if (marks.size > 1 && !confirm("現在のカードを捨てて新しいカードを作りますか？")) return;
    generateCard();
    save();
    render(true);
  });

  function spawnStars() {
    const el = document.getElementById("stars");
    const COUNT = 90;
    for (let i = 0; i < COUNT; i++) {
      const s = document.createElement("span");
      const isGold = Math.random() < 0.18;
      const isGlow = Math.random() < 0.3;
      s.className = "star" + (isGold ? " gold" : "") + (isGlow ? " glow" : "");
      const size = (Math.random() * 2 + (isGlow ? 1.4 : 1)).toFixed(1);
      s.style.width = size + "px";
      s.style.height = size + "px";
      s.style.left = (Math.random() * 100).toFixed(2) + "%";
      s.style.top = (Math.random() * 100).toFixed(2) + "%";
      s.style.animationDuration = (1.8 + Math.random() * 3.6).toFixed(2) + "s";
      s.style.animationDelay = (Math.random() * 5).toFixed(2) + "s";
      s.style.setProperty("--min-o", (0.08 + Math.random() * 0.15).toFixed(2));
      s.style.setProperty("--max-o", (0.6 + Math.random() * 0.4).toFixed(2));
      el.appendChild(s);
    }
  }

  if (!load()) generateCard();
  render(true);
  save();
  spawnStars();
</script>
</body>
</html>
