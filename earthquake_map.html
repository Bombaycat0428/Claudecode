<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>世界の主要地震マップ | Earthquake Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --accent:   #C0362C;
    --acc-hi:   #DC4A3D;
    --ink:      #1E1B18;
    --gray:     #6B625A;
    --border:   rgba(30,27,24,0.10);
    --shadow:   rgba(30,27,24,0.10);
    --sw:       340px;

    --m6: #F5C242;
    --m7: #EF8A2E;
    --m8: #D8452F;
    --m9: #7A1F17;
  }

  html, body {
    height: 100%;
    font-family: "Noto Sans JP", sans-serif;
    color: var(--ink);
    background: #fff;
  }

  #app { display: flex; height: 100vh; overflow: hidden; }

  /* ── sidebar ── */
  #sidebar {
    width: var(--sw);
    flex-shrink: 0;
    background: #fff;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    box-shadow: 2px 0 20px var(--shadow);
    z-index: 10;
  }

  .sb-head {
    padding: 22px 20px 16px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .sb-logo {
    font-family: "Space Mono", monospace;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.18em;
    color: var(--accent);
    margin-bottom: 10px;
  }

  .sb-head h1 {
    font-size: 19px;
    font-weight: 700;
    margin-bottom: 6px;
    letter-spacing: 0.01em;
  }

  .sb-head .lede {
    font-size: 12.5px;
    color: var(--gray);
    line-height: 1.6;
  }

  .stat-row {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    margin-top: 14px;
    font-family: "Space Mono", monospace;
    font-size: 10.5px;
    color: var(--gray);
  }
  .stat-row b { color: var(--ink); font-size: 12.5px; display: block; }

  /* ── controls ── */
  .sb-controls {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .search-box {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #F7F4F1;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 12px;
    transition: border-color .15s;
  }
  .search-box:focus-within { border-color: var(--accent); }
  .search-box svg { flex-shrink: 0; opacity: 0.45; }
  .search-box input {
    border: none;
    outline: none;
    background: transparent;
    font-family: "Noto Sans JP", sans-serif;
    font-size: 13px;
    width: 100%;
    color: var(--ink);
  }
  .search-box input::placeholder { color: #A79E94; }

  .filter-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .filter-btn {
    font-family: "Space Mono", monospace;
    font-size: 10.5px;
    letter-spacing: 0.04em;
    color: var(--gray);
    background: none;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 5px 11px;
    cursor: pointer;
    transition: color .15s, border-color .15s, background .15s;
    user-select: none;
  }
  .filter-btn:hover { border-color: var(--acc-hi); color: var(--accent); }
  .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .sort-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: "Space Mono", monospace;
    font-size: 10px;
    color: var(--gray);
    letter-spacing: 0.05em;
  }
  .sort-row button {
    background: none;
    border: none;
    color: var(--accent);
    font-family: inherit;
    font-size: 10px;
    letter-spacing: 0.05em;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 2px;
  }

  /* ── list ── */
  #quakeList {
    flex: 1;
    overflow-y: auto;
    padding: 6px 0;
  }
  #quakeList::-webkit-scrollbar { width: 7px; }
  #quakeList::-webkit-scrollbar-thumb { background: #E3DDD5; border-radius: 4px; }

  .q-item {
    padding: 11px 20px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    display: flex;
    gap: 12px;
    align-items: flex-start;
    transition: background .12s;
  }
  .q-item:hover { background: #FBF7F3; }
  .q-item.active { background: #FCEEEB; }

  .q-mag {
    flex-shrink: 0;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Space Mono", monospace;
    font-weight: 700;
    font-size: 12.5px;
    color: #fff;
  }

  .q-body { min-width: 0; flex: 1; }
  .q-en {
    font-size: 13px;
    font-weight: 700;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .q-ja {
    font-size: 11.5px;
    color: var(--gray);
    margin-top: 1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .q-meta {
    font-family: "Space Mono", monospace;
    font-size: 10px;
    color: #A79E94;
    margin-top: 4px;
    letter-spacing: 0.02em;
  }

  #emptyMsg {
    padding: 30px 20px;
    font-size: 12.5px;
    color: var(--gray);
    text-align: center;
  }

  .sb-foot {
    padding: 12px 20px 16px;
    border-top: 1px solid var(--border);
    font-size: 10.5px;
    color: #A79E94;
    line-height: 1.6;
    flex-shrink: 0;
  }

  /* ── map ── */
  #map { flex: 1; height: 100%; background: #EAE6DF; }

  .leaflet-popup-content-wrapper { border-radius: 10px; }
  .qp { font-family: "Noto Sans JP", sans-serif; min-width: 200px; }
  .qp-en { font-size: 13.5px; font-weight: 700; color: var(--ink); }
  .qp-ja { font-size: 12px; color: var(--gray); margin-top: 1px; margin-bottom: 8px; }
  .qp-row {
    display: flex;
    justify-content: space-between;
    font-size: 11.5px;
    padding: 3px 0;
    border-top: 1px solid var(--border);
  }
  .qp-row span:first-child { color: var(--gray); }
  .qp-row span:last-child { font-family: "Space Mono", monospace; font-weight: 700; }
  .qp-note {
    font-size: 11px;
    color: var(--gray);
    line-height: 1.55;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
  }

  /* ── legend ── */
  #legend {
    position: absolute;
    left: calc(var(--sw) + 16px);
    bottom: 16px;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(6px);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    font-family: "Space Mono", monospace;
    font-size: 10.5px;
    color: var(--gray);
    box-shadow: 0 4px 18px var(--shadow);
    z-index: 500;
  }
  #legend .lg-title {
    font-size: 10px;
    letter-spacing: 0.08em;
    color: var(--ink);
    margin-bottom: 8px;
    font-weight: 700;
  }
  #legend .lg-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
  }
  #legend .lg-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  @media (max-width: 760px) {
    #app { flex-direction: column; }
    #sidebar { width: 100%; height: 46%; }
    #map { height: 54%; }
    #legend { left: 12px; bottom: 12px; }
  }
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="sb-head">
      <div class="sb-logo">EARTHQUAKE MAP</div>
      <h1>世界の主要地震</h1>
      <p class="lede">1755年〜現在までに発生した、世界の主な地震をまとめた地図です。円の大きさと色はマグニチュードを表します。</p>
      <div class="stat-row" id="statRow"></div>
    </div>

    <div class="sb-controls">
      <div class="search-box">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="searchInput" type="text" placeholder="地震名・国・地域で検索">
      </div>
      <div class="filter-row" id="filterRow">
        <button class="filter-btn active" data-min="0">すべて</button>
        <button class="filter-btn" data-min="6">M6+</button>
        <button class="filter-btn" data-min="7">M7+</button>
        <button class="filter-btn" data-min="8">M8+</button>
        <button class="filter-btn" data-min="9">M9+</button>
      </div>
      <div class="sort-row">
        <span id="countLabel">0件表示</span>
        <button id="sortToggle">年代順に切替</button>
      </div>
    </div>

    <div id="quakeList"></div>

    <div class="sb-foot">
      マグニチュード・死者数は資料により差があるため、いずれも概数・推定値です（出典: USGS, 気象庁, Wikipedia 等）。震源位置は代表点であり、古い地震ほど誤差が大きくなります。
    </div>
  </aside>

  <div id="map"></div>
  <div id="legend">
    <div class="lg-title">MAGNITUDE</div>
    <div class="lg-row"><span class="lg-dot" style="background:var(--m6)"></span>M6.0 〜 6.9</div>
    <div class="lg-row"><span class="lg-dot" style="background:var(--m7)"></span>M7.0 〜 7.9</div>
    <div class="lg-row"><span class="lg-dot" style="background:var(--m8)"></span>M8.0 〜 8.9</div>
    <div class="lg-row"><span class="lg-dot" style="background:var(--m9)"></span>M9.0 以上</div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // ── Data ─────────────────────────────────────────────────
  // マグニチュード・死者数は概数。出典が分かれる事象は幅を示すか「推定」と付記。
  const QUAKES = [
    { en:"1755 Lisbon earthquake", ja:"リスボン地震", place:"ポルトガル沖", date:"1755-11-01", mag:8.7, lat:36.0, lon:-11.0, deaths:"推定3万〜5万人超", note:"ポルトガル・リスボンを壊滅させた地震。地震・津波・火災が重なり被害が拡大し、近代防災思想のきっかけとなった。震源は推定値。" },
    { en:"1906 San Francisco earthquake", ja:"サンフランシスコ地震", place:"アメリカ", date:"1906-04-18", mag:7.9, lat:37.75, lon:-122.55, deaths:"推定3,000人", note:"サンアンドレアス断層で発生。市街地の大半を焼いた大火災で被害が拡大した。" },
    { en:"1906 Ecuador–Colombia earthquake", ja:"エクアドル・コロンビア地震", place:"エクアドル沖", date:"1906-01-31", mag:8.8, lat:1.0, lon:-81.5, deaths:"500〜1,500人", note:"南米太平洋岸で発生した巨大地震。太平洋全域に津波が到達した。" },
    { en:"1922 Vallenar earthquake", ja:"チリ・バジェナール地震", place:"チリ", date:"1922-11-11", mag:8.5, lat:-28.55, lon:-70.75, deaths:"約600人", note:"チリ北部を襲った巨大地震。太平洋沿岸に津波被害をもたらした。" },
    { en:"1923 Great Kantō earthquake", ja:"関東大震災", place:"日本", date:"1923-09-01", mag:7.9, lat:35.33, lon:139.13, deaths:"約10万5,000人", note:"相模湾を震源とし、地震後の大規模火災により東京・横浜で甚大な被害。日本の地震災害史上最悪級。" },
    { en:"1933 Sanriku earthquake", ja:"昭和三陸地震", place:"日本", date:"1933-03-03", mag:8.4, lat:39.2, lon:144.6, deaths:"約3,000人", note:"三陸沖を震源とする津波地震。大津波により沿岸集落が壊滅的被害を受けた。" },
    { en:"1938 Banda Sea earthquake", ja:"バンダ海地震", place:"インドネシア", date:"1938-02-01", mag:8.5, lat:-5.05, lon:131.62, deaths:"少数（不明）", note:"人口の少ない海域が震源だったため被害は限定的だったとされる、観測史上最大級の地震の一つ。" },
    { en:"1946 Nankai earthquake", ja:"昭和南海地震", place:"日本", date:"1946-12-21", mag:8.1, lat:33.03, lon:135.62, deaths:"約1,330人", note:"紀伊半島沖の南海トラフで発生。西日本太平洋岸に津波被害をもたらした。" },
    { en:"1948 Fukui earthquake", ja:"福井地震", place:"日本", date:"1948-06-28", mag:7.1, lat:36.17, lon:136.28, deaths:"約3,769人", note:"内陸直下型地震としては戦後最大級の被害。震度階級「震度7」新設のきっかけとなった。" },
    { en:"1950 Assam–Tibet earthquake", ja:"アッサム・チベット地震", place:"インド・中国国境", date:"1950-08-15", mag:8.6, lat:28.7, lon:96.7, deaths:"約4,800人", note:"ヒマラヤ東部で発生した内陸巨大地震。地滑りや洪水が被害を拡大させた。" },
    { en:"1952 Kamchatka earthquake", ja:"カムチャツカ地震", place:"ロシア", date:"1952-11-04", mag:9.0, lat:52.76, lon:160.06, deaths:"推定2,000人超", note:"観測史上最大級。太平洋を横断した津波はハワイや日本沿岸にも到達した。" },
    { en:"1957 Andreanof Islands earthquake", ja:"アンドリアノフ諸島地震", place:"アメリカ（アラスカ）", date:"1957-03-09", mag:8.6, lat:51.56, lon:-175.39, deaths:"直接死ほぼなし", note:"アリューシャン列島で発生。太平洋規模の津波を発生させたが人的被害は少なかった。" },
    { en:"1960 Valdivia earthquake", ja:"チリ地震（バルディビア地震）", place:"チリ", date:"1960-05-22", mag:9.5, lat:-38.29, lon:-73.05, deaths:"推定1,000〜6,000人", note:"観測史上最大の地震（M9.5）。太平洋を横断した津波は約22時間後に日本にも到達し、死者を出した。" },
    { en:"1964 Great Alaska earthquake", ja:"アラスカ地震", place:"アメリカ", date:"1964-03-28", mag:9.2, lat:61.02, lon:-147.65, deaths:"131人", note:"北米で観測史上最大の地震。プリンス・ウィリアム湾を中心に地盤変動と津波が発生した。" },
    { en:"1965 Rat Islands earthquake", ja:"ラット諸島地震", place:"アメリカ（アラスカ）", date:"1965-02-04", mag:8.7, lat:51.21, lon:178.5, deaths:"人的被害僅少", note:"アリューシャン列島西端で発生。太平洋規模の津波を発生させた。" },
    { en:"1970 Ancash earthquake", ja:"ペルー地震（アンカシュ地震）", place:"ペルー", date:"1970-05-31", mag:7.9, lat:-9.36, lon:-78.86, deaths:"推定約6万7,000人", note:"震源による揺れに加え、ワスカラン山で発生した岩雪崩がユンガイの町を埋没させ被害が拡大した。" },
    { en:"1976 Tangshan earthquake", ja:"唐山地震", place:"中国", date:"1976-07-28", mag:7.6, lat:39.6, lon:118.2, deaths:"公式24万2,000人（推定65万人説も）", note:"20世紀最悪の地震災害の一つ。工業都市・唐山を直下型地震が襲い、未明の発生で被害が拡大した。" },
    { en:"1985 Mexico City earthquake", ja:"メキシコ地震", place:"メキシコ", date:"1985-09-19", mag:8.0, lat:18.19, lon:-102.53, deaths:"推定5,000〜1万人超", note:"ミチョアカン州沖が震源だが、軟弱地盤のメキシコシティで長周期地震動により高層ビルが多数倒壊した。" },
    { en:"1990 Luzon earthquake", ja:"ルソン地震", place:"フィリピン", date:"1990-07-16", mag:7.7, lat:15.68, lon:121.17, deaths:"約1,600人", note:"ルソン島中部を襲った直下型地震。断層が地表に露出し大規模な建物倒壊を引き起こした。" },
    { en:"1994 Northridge earthquake", ja:"ノースリッジ地震", place:"アメリカ", date:"1994-01-17", mag:6.7, lat:34.21, lon:-118.54, deaths:"57人", note:"ロサンゼルス直下で発生。マグニチュードの割に被害額（当時史上最高額）が大きかったことで知られる。" },
    { en:"1995 Great Hanshin-Awaji earthquake", ja:"阪神・淡路大震災", place:"日本", date:"1995-01-17", mag:7.3, lat:34.59, lon:135.03, deaths:"6,434人", note:"淡路島北部を震源とする直下型地震。神戸市を中心に建物倒壊と火災で甚大な被害を出した。" },
    { en:"1999 İzmit earthquake", ja:"トルコ・イズミット地震", place:"トルコ", date:"1999-08-17", mag:7.6, lat:40.76, lon:29.97, deaths:"公式約1万7,000人", note:"北アナトリア断層で発生。人口密集地を襲い、建築基準の不備が被害を拡大させた。" },
    { en:"1999 Chi-Chi earthquake", ja:"台湾・集集地震", place:"台湾", date:"1999-09-21", mag:7.6, lat:23.85, lon:120.82, deaths:"2,415人", note:"台湾中部・南投県を震源とする内陸直下型地震。台湾史上最大級の被害となった。" },
    { en:"2001 Gujarat earthquake", ja:"インド・グジャラート地震", place:"インド", date:"2001-01-26", mag:7.7, lat:23.42, lon:70.23, deaths:"推定約2万人", note:"インド共和国記念日に発生。ブジ近郊を中心に広範囲で建物が倒壊した。" },
    { en:"2004 Indian Ocean earthquake", ja:"スマトラ島沖地震", place:"インドネシア", date:"2004-12-26", mag:9.1, lat:3.3, lon:95.78, deaths:"約22万7,000人", note:"21世紀最大級の地震。インド洋沿岸14ヶ国に津波が到達し、単一災害としては近年最多の死者を出した。" },
    { en:"2004 Chūetsu earthquake", ja:"新潟県中越地震", place:"日本", date:"2004-10-23", mag:6.6, lat:37.29, lon:138.87, deaths:"68人", note:"内陸直下型地震。新幹線の脱線や大規模な土砂災害を伴った。" },
    { en:"2005 Kashmir earthquake", ja:"カシミール地震", place:"パキスタン", date:"2005-10-08", mag:7.6, lat:34.49, lon:73.63, deaths:"推定約8万7,000人", note:"パキスタン北部・カシミール地方の山岳地帯を襲い、土砂崩れで集落が孤立し被害が拡大した。" },
    { en:"2008 Sichuan earthquake", ja:"四川大地震", place:"中国", date:"2008-05-12", mag:7.9, lat:31.0, lon:103.32, deaths:"約8万7,000人", note:"四川省汶川県を震源とする内陸直下型地震。学校倒壊など建築の耐震性が国際的な議論となった。" },
    { en:"2010 Haiti earthquake", ja:"ハイチ地震", place:"ハイチ", date:"2010-01-12", mag:7.0, lat:18.46, lon:-72.53, deaths:"推定10万〜31万人超（諸説あり）", note:"首都ポルトープランス近郊が震源。耐震性の低い建物が密集していたため甚大な被害となった。死者数は資料により大きく異なる。" },
    { en:"2010 Maule earthquake", ja:"チリ地震（マウレ地震）", place:"チリ", date:"2010-02-27", mag:8.8, lat:-36.12, lon:-72.9, deaths:"約525人", note:"1960年のバルディビア地震と近い震源域で発生。厳格な耐震基準により被害は比較的抑えられた。" },
    { en:"2011 Tōhoku earthquake", ja:"東北地方太平洋沖地震（東日本大震災）", place:"日本", date:"2011-03-11", mag:9.0, lat:38.3, lon:142.37, deaths:"約1万9,750人（行方不明含む）", note:"日本の観測史上最大の地震。巨大津波が太平洋沿岸を襲い、福島第一原発事故も引き起こした。" },
    { en:"2011 Christchurch earthquake", ja:"クライストチャーチ地震", place:"ニュージーランド", date:"2011-02-22", mag:6.3, lat:-43.6, lon:172.68, deaths:"185人", note:"前年のダーフィールド地震の余震域で発生。都心直下という立地条件から人的被害が大きくなった。" },
    { en:"2012 Indian Ocean earthquake", ja:"インド洋（スマトラ沖）地震", place:"インドネシア沖", date:"2012-04-11", mag:8.6, lat:2.31, lon:93.06, deaths:"約10人", note:"観測史上最大級の横ずれ型地震。プレート境界ではなくプレート内部で発生した珍しい事例。" },
    { en:"2015 Gorkha earthquake", ja:"ネパール地震（ゴルカ地震）", place:"ネパール", date:"2015-04-25", mag:7.8, lat:28.23, lon:84.73, deaths:"約8,960人", note:"カトマンズ盆地を中心に甚大な被害。世界遺産の歴史的建造物も多数倒壊した。" },
    { en:"2016 Kumamoto earthquakes", ja:"熊本地震", place:"日本", date:"2016-04-16", mag:7.0, lat:32.75, lon:130.76, deaths:"273人（災害関連死含む）", note:"震度7を観測する地震が28時間のうちに2回発生した、前例の少ない地震活動。" },
    { en:"2016 Ecuador earthquake", ja:"エクアドル地震", place:"エクアドル", date:"2016-04-16", mag:7.8, lat:0.38, lon:-79.94, deaths:"約673人", note:"太平洋沿岸のペデルナレス付近を震源とする直下型地震。" },
    { en:"2018 Sulawesi earthquake", ja:"スラウェシ島地震（パル地震）", place:"インドネシア", date:"2018-09-28", mag:7.5, lat:-0.18, lon:119.85, deaths:"約4,340人", note:"地震に伴う津波に加え、地盤の液状化現象（流動化）が集落ごと地面を押し流し被害を拡大させた。" },
    { en:"2021 Haiti earthquake", ja:"ハイチ地震（2021年）", place:"ハイチ", date:"2021-08-14", mag:7.2, lat:18.43, lon:-73.48, deaths:"約2,248人", note:"2010年とは別の断層で発生。ハイチ南西部を中心に建物倒壊が相次いだ。" },
    { en:"2023 Turkey–Syria earthquake", ja:"トルコ・シリア地震", place:"トルコ・シリア", date:"2023-02-06", mag:7.8, lat:37.17, lon:37.03, deaths:"約5万9,000人（両国合計）", note:"数時間後にM7.5の地震が近隣で発生し被害が連鎖。21世紀に入って最多の死者を出した地震の一つ。" },
    { en:"2024 Noto Peninsula earthquake", ja:"令和6年能登半島地震", place:"日本", date:"2024-01-01", mag:7.6, lat:37.5, lon:137.27, deaths:"489人（災害関連死含む）", note:"元日に発生し、能登半島の道路網が寸断され孤立集落が多数発生。復旧の遅れが課題となった。" },
  ];

  QUAKES.forEach((q, i) => q.id = i);

  // ── Helpers ──────────────────────────────────────────────
  function magColor(m) {
    if (m >= 9) return getVar('--m9');
    if (m >= 8) return getVar('--m8');
    if (m >= 7) return getVar('--m7');
    return getVar('--m6');
  }
  function getVar(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }
  function magRadius(m) {
    return Math.max(6, (m - 5.5) * 5.5);
  }
  const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  // ── Map setup ────────────────────────────────────────────
  const map = L.map('map', {
    center: [15, 20],
    zoom: 2,
    zoomControl: false,
    worldCopyJump: true,
  });
  L.control.zoom({ position: 'topright' }).addTo(map);

  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
    subdomains: 'abcd',
    maxZoom: 19,
  }).addTo(map);

  const markersLayer = L.layerGroup().addTo(map);
  const markerById = {};

  QUAKES.forEach(q => {
    const marker = L.circleMarker([q.lat, q.lon], {
      radius: magRadius(q.mag),
      color: '#fff',
      weight: 1.5,
      fillColor: magColor(q.mag),
      fillOpacity: 0.62,
    });
    marker.bindPopup(
      `<div class="qp">
        <div class="qp-en">${esc(q.en)}</div>
        <div class="qp-ja">${esc(q.ja)}</div>
        <div class="qp-row"><span>発生日</span><span>${esc(q.date)}</span></div>
        <div class="qp-row"><span>マグニチュード</span><span>M${q.mag.toFixed(1)}</span></div>
        <div class="qp-row"><span>震源</span><span>${esc(q.place)}</span></div>
        <div class="qp-row"><span>死者数</span><span>${esc(q.deaths)}</span></div>
        <div class="qp-note">${esc(q.note)}</div>
      </div>`,
      { maxWidth: 260 }
    );
    marker.on('click', () => highlightItem(q.id));
    markerById[q.id] = marker;
  });

  // ── Sidebar state ───────────────────────────────────────
  let minMag = 0;
  let searchText = '';
  let sortMode = 'mag'; // 'mag' | 'date'

  function filteredQuakes() {
    const t = searchText.trim().toLowerCase();
    let arr = QUAKES.filter(q => {
      if (q.mag < minMag) return false;
      if (!t) return true;
      return (q.en + q.ja + q.place).toLowerCase().includes(t);
    });
    arr.sort((a, b) => sortMode === 'mag' ? b.mag - a.mag : a.date.localeCompare(b.date));
    return arr;
  }

  function render() {
    const list = document.getElementById('quakeList');
    const arr = filteredQuakes();

    markersLayer.clearLayers();
    arr.forEach(q => markerById[q.id].addTo(markersLayer));

    document.getElementById('countLabel').textContent = `${arr.length}件表示 / 全${QUAKES.length}件`;

    list.innerHTML = '';
    if (!arr.length) {
      const msg = document.createElement('p');
      msg.id = 'emptyMsg';
      msg.textContent = '該当する地震がありません';
      list.appendChild(msg);
      return;
    }

    arr.forEach(q => {
      const item = document.createElement('div');
      item.className = 'q-item';
      item.dataset.id = q.id;

      const magEl = document.createElement('div');
      magEl.className = 'q-mag';
      magEl.style.background = magColor(q.mag);
      magEl.textContent = 'M' + q.mag.toFixed(1);

      const body = document.createElement('div');
      body.className = 'q-body';
      body.innerHTML = `<div class="q-en">${esc(q.en)}</div>`
                      + `<div class="q-ja">${esc(q.ja)} ・ ${esc(q.place)}</div>`
                      + `<div class="q-meta">${esc(q.date)}</div>`;

      item.append(magEl, body);
      item.addEventListener('click', () => {
        map.flyTo([q.lat, q.lon], Math.max(map.getZoom(), 5), { duration: 0.7 });
        markerById[q.id].openPopup();
        highlightItem(q.id);
      });
      list.appendChild(item);
    });
  }

  function highlightItem(id) {
    document.querySelectorAll('.q-item').forEach(el =>
      el.classList.toggle('active', Number(el.dataset.id) === id)
    );
  }

  // ── Stats ────────────────────────────────────────────────
  function renderStats() {
    const biggest = QUAKES.reduce((a, b) => a.mag > b.mag ? a : b);
    const row = document.getElementById('statRow');
    row.innerHTML = `
      <div><b>${QUAKES.length}件</b>収録地震数</div>
      <div><b>M${biggest.mag.toFixed(1)}</b>最大（${esc(biggest.ja)}）</div>
      <div><b>1755〜2024</b>データ期間</div>
    `;
  }

  // ── Controls ─────────────────────────────────────────────
  document.getElementById('searchInput').addEventListener('input', e => {
    searchText = e.target.value;
    render();
  });

  document.getElementById('filterRow').addEventListener('click', e => {
    const btn = e.target.closest('.filter-btn');
    if (!btn) return;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    minMag = Number(btn.dataset.min);
    render();
  });

  document.getElementById('sortToggle').addEventListener('click', e => {
    sortMode = sortMode === 'mag' ? 'date' : 'mag';
    e.target.textContent = sortMode === 'mag' ? '年代順に切替' : 'マグニチュード順に切替';
    render();
  });

  renderStats();
  render();
</script>
</body>
</html>
