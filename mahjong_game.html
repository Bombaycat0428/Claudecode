<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>麻雀 対戦練習 — CPU3人と東1局</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FBF6EC;
    --card: #FFFFFF;
    --ink: #2A2622;
    --muted: #857D6E;
    --line: #EAE1CF;
    --soft: #F5EDDC;
    --accent: #FF5A4D;
    --accent-dark: #D63A2E;
    --amber: #FFB000;
    --blue: #3DA9E0;
    --green: #5BA85A;
    --purple: #9B7BD4;
    --felt: #2F6B4F;
    --felt-dark: #234F3B;
  }
  [data-theme="dark"] {
    --bg: #1E1B18;
    --card: #2A2622;
    --ink: #FBF6EC;
    --muted: #B8B0A2;
    --line: #3A352E;
    --soft: #262220;
    --felt: #234A38;
    --felt-dark: #17362A;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "M PLUS Rounded 1c", "Noto Sans JP", sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    transition: background .3s, color .3s;
  }
  .page { max-width: 1040px; margin: 0 auto; padding: 28px 16px 64px; }

  .topbar {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 16px; flex-wrap: wrap; margin-bottom: 18px;
  }
  .title-block h1 { font-size: 24px; font-weight: 800; }
  .title-block p { color: var(--muted); font-size: 13.5px; margin-top: 4px; }
  .theme-btn {
    display: flex; align-items: center; gap: 7px;
    font-family: inherit; font-weight: 700; font-size: 13px;
    color: var(--ink); background: var(--card);
    border: 1px solid var(--line); border-radius: 999px;
    padding: 8px 16px; cursor: pointer; flex-shrink: 0;
  }

  /* scoreboard */
  .scorebar {
    display: flex; gap: 10px; flex-wrap: wrap;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 12px 16px; margin-bottom: 16px;
  }
  .score-chip { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; }
  .score-chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .score-chip.dealer .dot { background: var(--accent); }
  .score-chip .pt { color: var(--muted); font-weight: 700; }
  .score-chip.riichi { color: var(--accent-dark); }

  /* table */
  .table {
    display: grid;
    grid-template-columns: 150px 1fr 150px;
    grid-template-rows: auto auto auto;
    gap: 8px;
    background: var(--felt);
    border-radius: 20px;
    padding: 16px;
    box-shadow: inset 0 2px 14px rgba(0,0,0,.28);
    margin-bottom: 18px;
  }
  .seatbox {
    background: rgba(0,0,0,.16);
    border-radius: 12px;
    padding: 8px 10px;
    min-height: 92px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .seatbox .seat-head { display: flex; align-items: center; justify-content: space-between; font-size: 11.5px; font-weight: 800; color: rgba(255,255,255,.92); }
  .seatbox .seat-head .wind { background: rgba(255,255,255,.18); border-radius: 999px; padding: 1px 8px; }
  .seatbox .kawa { display: flex; flex-wrap: wrap; gap: 2px; }
  .seatbox .melds { display: flex; gap: 6px; flex-wrap: wrap; }
  .seatbox .meld-group { display: flex; gap: 1px; background: rgba(255,255,255,.1); border-radius: 4px; padding: 2px; }
  .north { grid-column: 2; grid-row: 1; }
  .west { grid-column: 1; grid-row: 2; }
  .center-info {
    grid-column: 2; grid-row: 2;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    color: rgba(255,255,255,.95); text-align: center;
  }
  .east-cpu { grid-column: 3; grid-row: 2; }
  .south { grid-column: 2; grid-row: 3; }
  .center-info .round-label { font-size: 15px; font-weight: 800; }
  .center-info .wall-count { font-size: 12px; opacity: .85; }
  .center-info .turn-indicator {
    font-size: 12.5px; font-weight: 800;
    background: rgba(255,255,255,.16); border-radius: 999px; padding: 4px 14px;
  }
  .center-info .dora-row { display: flex; align-items: center; gap: 6px; font-size: 11px; opacity: .9; }

  /* tiles (shared with guide) */
  .tile {
    width: 30px; height: 41px;
    background: linear-gradient(180deg,#FFFFFF,#FBF3DE);
    border: 1px solid #D8CBA8; border-radius: 4px;
    box-shadow: 0 2px 3px rgba(0,0,0,.16), inset 0 0 0 1px rgba(255,255,255,.55);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative; flex-shrink: 0;
  }
  .tile.tile-lg { width: 46px; height: 62px; border-radius: 6px; }
  .tile.tile-sm { width: 22px; height: 30px; border-radius: 3px; }
  .tile-m .num { font-size: 14px; font-weight: 800; color: #2A2622; line-height: 1; }
  .tile-lg.tile-m .num { font-size: 21px; }
  .tile-sm.tile-m .num { font-size: 10px; }
  .tile-m .suit { font-size: 8.5px; color: #D63A2E; font-weight: 700; margin-top: 1px; }
  .tile-lg.tile-m .suit { font-size: 12px; }
  .tile-sm.tile-m .suit { font-size: 6px; }
  .tile-p .dots, .tile-s .bars { display: flex; flex-direction: column; gap: 1.5px; align-items: center; justify-content: center; }
  .dot-row, .bar-row { display: flex; gap: 1.5px; }
  .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--blue); flex-shrink: 0; }
  .tile-lg .dot { width: 7px; height: 7px; }
  .tile-sm .dot { width: 3px; height: 3px; }
  .bar { width: 3px; height: 8px; border-radius: 1.5px; background: var(--green); flex-shrink: 0; }
  .tile-lg .bar { width: 5px; height: 13px; }
  .tile-sm .bar { width: 2px; height: 6px; }
  .bar.bar-one { width: 5px; height: 17px; border-radius: 2.5px; background: var(--accent-dark); }
  .tile-lg .bar.bar-one { width: 8px; height: 28px; }
  .tile-sm .bar.bar-one { width: 3px; height: 12px; }
  .tile-z .kanji { font-size: 15px; font-weight: 800; color: #2A2622; }
  .tile-lg.tile-z .kanji { font-size: 24px; }
  .tile-sm.tile-z .kanji { font-size: 11px; }
  .tile-z.haku .kanji { color: transparent; -webkit-text-stroke: 1.1px var(--blue); }
  .tile-z.hatsu .kanji { color: #2F8F52; }
  .tile-z.chun .kanji { color: #D63A2E; }
  .tile.tile-back {
    background: linear-gradient(135deg,#3a7a5c,#1f4433);
    border: 1px solid rgba(0,0,0,.3);
  }
  .tile.dora-marker { outline: 2px solid var(--amber); outline-offset: 1px; }
  .tile.just-drawn { transform: translateY(-6px); box-shadow: 0 6px 8px rgba(0,0,0,.22); }
  .tile.clickable { cursor: pointer; transition: transform .1s; }
  .tile.clickable:hover { transform: translateY(-4px); }
  .tile.tile-disabled { opacity: .35; cursor: default; }
  .tile.tile-disabled:hover { transform: none; }

  /* player panel */
  .player-panel {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 16px 18px; display: flex; flex-direction: column; gap: 12px;
  }
  .player-hand-row { display: flex; gap: 4px; flex-wrap: wrap; min-height: 62px; align-items: flex-end; }
  .player-meld-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .player-controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .btn {
    font-family: inherit; cursor: pointer; font-weight: 800; font-size: 14px;
    padding: 10px 22px; border-radius: 999px; border: none;
    background: var(--accent); color: #fff;
  }
  .btn.secondary { background: var(--soft); color: var(--ink); border: 1px solid var(--line); }
  .btn.riichi-armed { background: var(--accent-dark); }
  .btn:disabled { opacity: .35; cursor: default; }
  .status-line { font-size: 13.5px; color: var(--muted); font-weight: 700; min-height: 18px; }

  /* modal */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(20,16,12,.55);
    display: none; align-items: center; justify-content: center; z-index: 50; padding: 16px;
  }
  .modal-overlay.show { display: flex; }
  .modal-box {
    background: var(--card); border-radius: 18px; padding: 24px;
    max-width: 460px; width: 100%; box-shadow: 0 14px 40px rgba(0,0,0,.3);
  }
  .modal-box h3 { font-size: 17px; font-weight: 800; margin-bottom: 12px; }
  .modal-tiles { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .modal-btns { display: flex; gap: 10px; flex-wrap: wrap; }
  .modal-yaku-list { font-size: 13.5px; margin-bottom: 12px; }
  .modal-yaku-list li { display: flex; justify-content: space-between; padding: 3px 0; }

  .result-panel {
    background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    padding: 28px; text-align: center; margin-top: 18px;
  }
  .result-panel h2 { font-size: 22px; font-weight: 800; margin-bottom: 8px; }
  .result-panel .sub { color: var(--muted); font-size: 14px; margin-bottom: 18px; }
  .result-hand-row { display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; margin-bottom: 16px; }
  .result-yaku { max-width: 340px; margin: 0 auto 18px; text-align: left; font-size: 14px; }
  .result-yaku li { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px dashed var(--line); }
  .result-points { font-size: 26px; font-weight: 800; color: var(--accent-dark); margin-bottom: 18px; }
  .result-pay-list { font-size: 13px; color: var(--muted); margin-bottom: 18px; }
</style>
</head>
<body>
<div class="page">
  <div class="topbar">
    <div class="title-block">
      <h1>麻雀 対戦練習</h1>
      <p>CPU3人との東1局。ツモ・ロン・ポン・チー・カン・リーチが実際に体験できます。</p>
    </div>
    <button class="theme-btn" id="themeBtn"><span id="themeIcon">☾</span><span id="themeText">Dark</span></button>
  </div>

  <div class="scorebar" id="scorebar"></div>

  <div class="table">
    <div class="seatbox north" id="seat-W"></div>
    <div class="seatbox west" id="seat-N"></div>
    <div class="center-info" id="centerInfo"></div>
    <div class="seatbox east-cpu" id="seat-S"></div>
    <div class="seatbox south" id="seat-E"></div>
  </div>

  <div class="player-panel">
    <div class="player-meld-row" id="playerMelds"></div>
    <div class="player-hand-row" id="playerHand"></div>
    <div class="player-controls">
      <button class="btn secondary" id="riichiBtn" style="display:none;">リーチ</button>
      <button class="btn" id="tsumoBtn" style="display:none;">ツモ！</button>
      <button class="btn" id="restartBtn" style="display:none;">もう一度</button>
    </div>
    <div class="status-line" id="statusLine">準備中…</div>
  </div>

  <div id="resultArea"></div>
</div>

<div class="modal-overlay" id="callModal">
  <div class="modal-box">
    <h3 id="callModalTitle">牌が捨てられました</h3>
    <div class="modal-tiles" id="callModalTile"></div>
    <div class="modal-btns" id="callModalBtns"></div>
  </div>
</div>

<script>
window.MJ = {};
</script>
<script src="mahjong_game.js"></script>
</body>
</html>
