<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seoul Map — 地下鉄路線図つきピン地図</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --accent:  #2563EB;
    --acc-hi:  #3B82F6;
    --ink:     #1E293B;
    --gray:    #64748B;
    --border:  rgba(0,0,0,0.08);
    --shadow:  rgba(30,41,59,0.10);
    --sw:      280px;
  }

  html, body {
    height: 100%;
    font-family: "Noto Sans JP", sans-serif;
    color: var(--ink);
  }

  /* ── layout ── */
  #app { display: flex; height: 100vh; overflow: hidden; }

  /* ── sidebar ── */
  #sidebar {
    width: var(--sw);
    flex-shrink: 0;
    background: #fff;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    box-shadow: 2px 0 20px var(--shadow);
    z-index: 10;
  }

  .sb-head {
    padding: 22px 18px 16px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .sb-logo {
    font-family: "Space Mono", monospace;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.14em;
    color: var(--accent);
    margin-bottom: 14px;
  }

  .sb-tools {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
  }

  .tool-btn {
    font-family: "Space Mono", monospace;
    font-size: 10px;
    color: var(--gray);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    background: none;
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 4px 8px;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
    user-select: none;
  }
  .tool-btn:hover { color: var(--accent); border-color: rgba(37,99,235,0.3); }
  .tool-btn.active { color: #fff; background: var(--accent); border-color: var(--accent); }

  .sb-count {
    font-family: "Space Mono", monospace;
    font-size: 10px;
    color: var(--gray);
    letter-spacing: 0.08em;
    margin-top: 10px;
  }

  .sb-hint {
    padding: 9px 18px 11px;
    font-size: 12px;
    color: var(--gray);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    letter-spacing: 0.02em;
    line-height: 1.6;
  }

  /* ── 住所検索 ── */
  .sb-search {
    padding: 10px 14px 12px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .search-row {
    display: flex;
    gap: 6px;
  }

  .search-input {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 7px 10px;
    font-family: "Noto Sans JP", sans-serif;
    font-size: 13px;
    color: var(--ink);
    outline: none;
    min-width: 0;
    transition: border-color 0.15s, background 0.15s;
    background: #F8FAFC;
  }
  .search-input:focus { border-color: var(--accent); background: #fff; }
  .search-input::placeholder { color: var(--gray); opacity: 0.6; }

  .search-btn {
    width: 34px; height: 34px;
    background: var(--accent);
    border: none;
    border-radius: 4px;
    color: #fff;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s, opacity 0.15s;
  }
  .search-btn:hover:not(:disabled) { background: var(--acc-hi); }
  .search-btn:disabled { opacity: 0.45; cursor: default; }

  .search-msg {
    font-family: "Space Mono", monospace;
    font-size: 10px;
    margin-top: 5px;
    min-height: 13px;
    letter-spacing: 0.04em;
  }
  .search-msg.err  { color: #c05050; }
  .search-msg.info { color: var(--gray); }
  .search-note {
    margin-top: 5px;
    font-size: 10px;
    color: var(--gray);
    opacity: 0.7;
    line-height: 1.4;
  }

  /* ── 路線トグル ── */
  .sb-lines {
    padding: 11px 14px 12px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .sb-lines-label {
    font-family: "Space Mono", monospace;
    font-size: 10px;
    font-weight: 700;
    color: var(--gray);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .lines-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }
  .line-chip {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 4px 9px 4px 7px;
    border-radius: 12px;
    cursor: pointer;
    user-select: none;
    font-size: 10.5px;
    color: var(--ink);
    background: #F8FAFC;
    border: 1px solid var(--border);
    transition: opacity 0.15s, background 0.15s, border-color 0.15s;
  }
  .line-chip:hover { background: #EEF2FF; border-color: rgba(37,99,235,0.3); }
  .line-chip.off { opacity: 0.35; }
  .line-chip .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .lines-note {
    margin-top: 8px;
    font-size: 10px;
    color: var(--gray);
    opacity: 0.7;
    line-height: 1.4;
  }

  /* ── highlighter (蛍光ペン) ── */
  .hl-panel {
    display: none;
    padding: 10px 18px 12px;
    border-bottom: 1px solid var(--border);
    flex-direction: column;
    gap: 8px;
  }
  .hl-panel.open { display: flex; }
  .hl-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .hl-colors { display: flex; gap: 6px; }
  .hl-color-dot {
    width: 20px; height: 20px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    padding: 0;
    transition: transform 0.12s, border-color 0.12s;
  }
  .hl-color-dot:hover { transform: scale(1.12); }
  .hl-color-dot.active { border-color: var(--ink); }
  .hl-sizes { display: flex; gap: 4px; margin-left: auto; }
  .hl-size-btn {
    width: 24px; height: 24px;
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 4px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--gray);
    padding: 0;
    transition: color 0.15s, border-color 0.15s, background 0.15s;
  }
  .hl-size-btn .dot { display: block; border-radius: 50%; background: currentColor; }
  .hl-size-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(37,99,235,0.06); }
  .hl-erase-btn.active { color: #fff; background: #d05050; border-color: #d05050; }

  #map.highlight-draw-active { cursor: crosshair; }
  #map.highlight-draw-active .leaflet-marker-icon,
  #map.highlight-draw-active .leaflet-interactive {
    pointer-events: none !important;
  }
  #map.highlight-erase-active { cursor: cell; }
  #map.highlight-erase-active .leaflet-marker-icon,
  #map.highlight-erase-active .leaflet-interactive:not(.highlighter-stroke) {
    pointer-events: none !important;
  }
  .highlighter-stroke { mix-blend-mode: multiply; }

  /* ── pin list ── */
  #pinList {
    flex: 1;
    overflow-y: auto;
  }
  #pinList::-webkit-scrollbar { width: 4px; }
  #pinList::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  #emptyMsg {
    padding: 52px 20px;
    text-align: center;
    font-size: 13px;
    color: var(--gray);
    line-height: 2.4;
  }

  .pin-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 14px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.12s;
    animation: pinIn 0.28s cubic-bezier(0.2,0,0,1) both;
  }
  .pin-item:hover { background: rgba(37,99,235,0.04); }
  .pin-item.active { background: rgba(37,99,235,0.09); }

  @keyframes pinIn {
    from { opacity: 0; transform: translateX(-6px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  .pin-num {
    width: 24px; height: 24px;
    background: var(--accent);
    border-radius: 50%;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: "Space Mono", monospace;
    font-size: 10px;
    font-weight: 700;
    color: #fff;
  }

  .pin-info { flex: 1; min-width: 0; }

  .pin-name {
    font-size: 13px;
    font-weight: 500;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 2px;
  }

  .pin-coords {
    font-family: "Space Mono", monospace;
    font-size: 10px;
    color: var(--gray);
    letter-spacing: 0.01em;
  }

  .pin-del {
    width: 22px; height: 22px;
    background: none;
    border: none;
    color: transparent;
    font-size: 10px;
    cursor: pointer;
    border-radius: 3px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: color 0.15s, background 0.15s;
  }
  .pin-item:hover .pin-del { color: var(--gray); }
  .pin-del:hover { color: #d05050 !important; background: rgba(200,50,50,0.07); }

  .pin-edit-btn {
    width: 22px; height: 22px;
    background: none;
    border: none;
    color: transparent;
    font-size: 13px;
    cursor: pointer;
    border-radius: 3px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: color 0.15s, background 0.15s;
  }
  .pin-item:hover .pin-edit-btn { color: var(--gray); }
  .pin-edit-btn:hover { color: var(--accent) !important; background: rgba(37,99,235,0.07); }
  .pin-edit-btn.has-info { color: var(--accent) !important; opacity: 0.65; }
  .pin-item:hover .pin-edit-btn.has-info { opacity: 1; }

  .pin-drag {
    cursor: grab;
    color: var(--gray);
    font-size: 14px;
    padding: 0 4px 0 2px;
    flex-shrink: 0;
    user-select: none;
    opacity: 0;
    transition: opacity 0.15s;
  }
  .pin-item:hover .pin-drag { opacity: 1; }
  .pin-drag:active { cursor: grabbing; }
  .pin-item.dragging { opacity: 0.35; }
  .pin-item.drag-over-top { border-top: 2px solid var(--accent); }
  .pin-item.drag-over-bot { border-bottom: 2px solid var(--accent); }

  /* ── info modal ── */
  .info-overlay {
    position: fixed;
    inset: 0;
    background: rgba(30,41,59,0.45);
    backdrop-filter: blur(3px);
    z-index: 500;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .info-overlay.open { opacity: 1; pointer-events: all; }

  .info-modal {
    background: #fff;
    border-radius: 8px;
    width: min(480px, 94vw);
    max-height: 88vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 8px 40px rgba(0,0,0,0.16);
    transform: translateY(10px);
    transition: transform 0.2s;
  }
  .info-overlay.open .info-modal { transform: translateY(0); }

  .info-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 20px 14px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    gap: 10px;
  }

  .info-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .info-close {
    width: 28px; height: 28px;
    background: none;
    border: 1px solid var(--border);
    border-radius: 50%;
    color: var(--gray);
    font-size: 11px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: color 0.15s, border-color 0.15s;
  }
  .info-close:hover { color: var(--ink); border-color: var(--ink); }

  .info-body {
    overflow-y: auto;
    padding: 16px 20px 20px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .info-body::-webkit-scrollbar { width: 4px; }
  .info-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .info-section { display: flex; flex-direction: column; gap: 8px; }

  .info-section-label {
    font-family: "Space Mono", monospace;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .info-section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .info-sub-section {
    padding-left: 14px;
    border-left: 2px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .info-sub { display: flex; flex-direction: column; gap: 4px; }

  .info-sub-label {
    font-family: "Space Mono", monospace;
    font-size: 10px;
    color: var(--gray);
    letter-spacing: 0.08em;
  }

  .info-field {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px 10px;
    font-family: "Noto Sans JP", sans-serif;
    font-size: 13px;
    color: var(--ink);
    outline: none;
    background: #F8FAFC;
    transition: border-color 0.15s, background 0.15s;
  }
  .info-field:focus { border-color: var(--accent); background: #fff; }
  .info-field::placeholder { color: var(--gray); opacity: 0.5; }
  textarea.info-field { resize: vertical; min-height: 72px; line-height: 1.6; }

  .info-foot {
    padding: 14px 20px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: flex-end;
    flex-shrink: 0;
  }

  .info-save-btn {
    padding: 9px 32px;
    background: var(--accent);
    border: none;
    border-radius: 4px;
    color: #fff;
    font-family: "Noto Sans JP", sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s;
  }
  .info-save-btn:hover { background: var(--acc-hi); }

  .info-total {
    font-weight: 700;
    color: var(--accent);
    border-color: var(--accent) !important;
  }
  .info-total[readonly] {
    cursor: default;
    opacity: 0.85;
  }

  .url-row {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .url-row .info-field { flex: 1; min-width: 0; }

  .url-open-btn {
    flex-shrink: 0;
    width: 34px; height: 34px;
    background: var(--accent);
    color: #fff;
    border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
    text-decoration: none;
    transition: background 0.15s;
  }
  .url-open-btn:hover { background: var(--acc-hi); }

  /* ── map ── */
  #map { flex: 1; min-width: 0; }

  /* ── custom marker ── */
  .m-pin {
    width: 30px; height: 30px;
    background: var(--accent);
    border: 2.5px solid #fff;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: "Space Mono", monospace;
    font-size: 11px;
    font-weight: 700;
    color: #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,0.30);
    cursor: pointer;
  }

  /* ── sticky note ── */
  #map.note-mode-active { cursor: crosshair; }

  .leaflet-div-icon.note-icon { background: transparent; border: none; }

  .sticky-note {
    width: 140px; min-height: 108px;
    border-radius: 4px;
    padding: 8px 8px 6px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.20);
    display: flex; flex-direction: column; gap: 6px;
    cursor: grab;
    position: relative;
  }
  .sticky-note:active { cursor: grabbing; }

  .note-del {
    position: absolute; top: 3px; right: 3px;
    width: 16px; height: 16px; border: none; border-radius: 50%;
    background: rgba(0,0,0,0.12); color: rgba(0,0,0,0.55);
    font-size: 10px; line-height: 16px; text-align: center;
    cursor: pointer; padding: 0;
  }
  .note-del:hover { background: rgba(0,0,0,0.22); }

  .note-text {
    flex: 1; resize: none; border: none; background: transparent;
    font-family: "Noto Sans JP", sans-serif;
    font-size: 12.5px; line-height: 1.5; color: rgba(0,0,0,0.78);
    outline: none; width: 100%; cursor: text;
  }
  .note-text::placeholder { color: rgba(0,0,0,0.35); }

  .note-colors { display: flex; gap: 4px; }
  .note-color-dot {
    width: 12px; height: 12px; border-radius: 50%; cursor: pointer;
    border: 1.5px solid rgba(0,0,0,0.15); padding: 0;
  }
  .note-color-dot.active { border-color: rgba(0,0,0,0.55); }

  /* ── add-pin popup ── */
  .add-popup .leaflet-popup-content-wrapper {
    border-radius: 8px;
    box-shadow: 0 6px 28px rgba(0,0,0,0.14);
    border: 1px solid var(--border);
    padding: 0;
    overflow: hidden;
  }
  .add-popup .leaflet-popup-content { margin: 0; width: auto !important; }
  .add-popup .leaflet-popup-tip-container { display: none; }
  .add-popup .leaflet-popup-close-button { color: var(--gray) !important; font-size: 16px !important; top: 8px !important; right: 10px !important; }

  .popup-form {
    padding: 12px;
    display: flex;
    gap: 7px;
    min-width: 250px;
  }

  .popup-input {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 7px 10px;
    font-family: "Noto Sans JP", sans-serif;
    font-size: 13px;
    color: var(--ink);
    outline: none;
    min-width: 0;
    transition: border-color 0.15s;
  }
  .popup-input:focus { border-color: var(--accent); }
  .popup-input::placeholder { color: var(--gray); opacity: 0.7; }

  .popup-btn {
    padding: 7px 14px;
    background: var(--accent);
    border: none;
    border-radius: 4px;
    color: #fff;
    font-family: "Noto Sans JP", sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
    transition: background 0.15s;
  }
  .popup-btn:hover { background: var(--acc-hi); }

  /* Leaflet tooltip (pins) */
  .pin-tip {
    background: var(--ink) !important;
    color: #fff !important;
    border: none !important;
    border-radius: 4px !important;
    font-family: "Noto Sans JP", sans-serif !important;
    font-size: 12px !important;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2) !important;
    padding: 4px 9px !important;
  }
  .pin-tip::before { display: none !important; }

  /* Leaflet tooltip (subway station labels) */
  .st-tip {
    background: none !important;
    border: none !important;
    box-shadow: none !important;
    padding: 0 !important;
    font-family: "Noto Sans JP", sans-serif !important;
    font-weight: 700;
    font-size: 11px;
    color: #1E293B;
    text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 4px #fff, 0 0 4px #fff;
    pointer-events: none;
  }
  .st-tip::before { display: none !important; }
  .st-tip.minor { font-size: 10px; font-weight: 500; color: #475569; }
  #map:not(.show-major) .st-tip.major { display: none; }
  #map:not(.show-minor) .st-tip.minor { display: none; }

  /* ── color picker ── */
  .pin-color-btn {
    width: 22px; height: 22px;
    background: none;
    border: none;
    cursor: pointer;
    border-radius: 3px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
    padding: 0;
    opacity: 0;
  }
  .pin-item:hover .pin-color-btn { opacity: 1; }
  .pin-color-btn:hover { background: rgba(37,99,235,0.07); }

  #colorPicker {
    position: fixed;
    z-index: 1000;
    background: #fff;
    border: 1px solid rgba(0,0,0,0.12);
    border-radius: 8px;
    padding: 8px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.16);
    display: none;
    grid-template-columns: repeat(4, 26px);
    gap: 5px;
  }

  .color-swatch {
    width: 26px; height: 26px;
    border-radius: 50%;
    border: 2.5px solid transparent;
    cursor: pointer;
    transition: transform 0.12s, border-color 0.12s;
  }
  .color-swatch:hover { transform: scale(1.18); }
  .color-swatch.active { border-color: var(--ink); }

  /* ── toast ── */
  #toast {
    position: fixed;
    bottom: 24px;
    left: calc(var(--sw) + (100vw - var(--sw)) / 2);
    transform: translateX(-50%);
    background: var(--ink);
    color: #fff;
    font-family: "Space Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    padding: 8px 16px;
    border-radius: 4px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
    z-index: 9999;
    white-space: nowrap;
  }
  #toast.show { opacity: 1; }

  /* ── mobile ── */
  @media (max-width: 640px) {
    #app { flex-direction: column; }
    #sidebar { width: 100%; height: 44vh; border-right: none; border-bottom: 1px solid var(--border); }
    #map { flex: 1; min-height: 0; }
    #toast { left: 50%; }
  }
</style>
</head>
<body>
<div id="app">

  <div id="sidebar">
    <div class="sb-head">
      <div class="sb-logo">SEOUL MAP</div>
      <div class="sb-tools">
        <button class="tool-btn" id="btnHome">ソウルに戻る</button>
        <button class="tool-btn" id="btnAddNote">📝 付箋</button>
        <button class="tool-btn" id="btnHighlight">🖍 マーカー</button>
        <button class="tool-btn" id="btnExport">Export</button>
        <label  class="tool-btn" for="importInput">Import</label>
        <input type="file" id="importInput" accept=".json" style="display:none">
        <button class="tool-btn" id="btnClear">全削除</button>
      </div>
      <div class="sb-count" id="pinCount">0 ピン</div>
    </div>
    <div class="sb-hint">地図または駅をクリックするとピンを追加できます</div>

    <div class="hl-panel" id="hlPanel">
      <div class="hl-row">
        <div class="hl-colors" id="hlColors"></div>
        <div class="hl-sizes">
          <button class="hl-size-btn" data-size="8" title="細"><span class="dot" style="width:6px;height:6px;"></span></button>
          <button class="hl-size-btn active" data-size="14" title="中"><span class="dot" style="width:10px;height:10px;"></span></button>
          <button class="hl-size-btn" data-size="22" title="太"><span class="dot" style="width:14px;height:14px;"></span></button>
        </div>
      </div>
      <button class="tool-btn hl-erase-btn" id="btnEraseHl" style="align-self:flex-start">🧽 消しゴム</button>
    </div>

    <div class="sb-search">
      <form id="searchForm" autocomplete="off">
        <div class="search-row">
          <input type="text" id="searchInput" class="search-input" placeholder="住所・場所名で検索">
          <button type="submit" class="search-btn" id="searchBtn" aria-label="検索">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
              <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
          </button>
        </div>
        <div class="search-msg" id="searchMsg"></div>
      </form>
      <div class="search-note">※ 検索できない場合は地図を直接クリックしてピンを追加してください</div>
    </div>

    <div class="sb-lines">
      <div class="sb-lines-label">路線</div>
      <div class="lines-grid" id="linesGrid"></div>
      <div class="lines-note">※ 路線・駅位置は簡略化した近似表示です</div>
    </div>

    <div id="pinList">
      <p id="emptyMsg">まだピンがありません</p>
    </div>
  </div>

  <div id="map"></div>
</div>
<div id="toast"></div>
<div id="colorPicker"></div>

<!-- 情報入力モーダル -->
<div class="info-overlay" id="infoOverlay">
  <div class="info-modal">
    <div class="info-head">
      <div class="info-title" id="infoTitle"></div>
      <button class="info-close" id="infoClose" aria-label="閉じる">✕</button>
    </div>
    <div class="info-body">

      <div class="info-section">
        <div class="info-section-label">🚃 電車</div>
        <div class="info-sub-section">
          <div class="info-sub">
            <div class="info-sub-label">💴 合計</div>
            <input type="text" class="info-field info-total" id="infoTrainTotal" placeholder="例：往復 3,200W">
          </div>
        </div>
        <textarea class="info-field" id="infoTrain" placeholder="路線・最寄り駅・乗り換えなど"></textarea>
      </div>

      <div class="info-section">
        <div class="info-section-label">🚗 車</div>
        <div class="info-sub-section">
          <div class="info-sub">
            <div class="info-sub-label">💴 合計</div>
            <input type="text" class="info-field info-total" id="infoCarTotal" placeholder="ガソリン・駐車場・高速から自動計算" readonly>
          </div>
          <div class="info-sub">
            <div class="info-sub-label">⛽ ガソリン</div>
            <input type="text" class="info-field" id="infoGas" placeholder="近くのスタンド・価格など">
          </div>
          <div class="info-sub">
            <div class="info-sub-label">🅿 駐車場</div>
            <input type="text" class="info-field" id="infoParking" placeholder="場所・料金・台数など">
          </div>
          <div class="info-sub">
            <div class="info-sub-label">🛣 高速</div>
            <input type="text" class="info-field" id="infoHighway" placeholder="最寄りIC・ルートなど">
          </div>
        </div>
      </div>

      <div class="info-section">
        <div class="info-section-label">📍 住所・URL</div>
        <div class="info-sub">
          <div class="info-sub-label">📍 住所</div>
          <input type="text" class="info-field" id="infoAddress" placeholder="例：ソウル特別市中区太平路1街31">
        </div>
        <div class="info-sub">
          <div class="info-sub-label">🔗 URL</div>
          <div class="url-row">
            <input type="url" class="info-field" id="infoUrl" placeholder="例：https://example.com">
            <a id="infoUrlOpen" class="url-open-btn" href="#" target="_blank" rel="noopener noreferrer" aria-label="URLを開く" style="display:none">↗</a>
          </div>
        </div>
      </div>

    </div>
    <div class="info-foot">
      <button class="info-save-btn" id="infoSave">保存</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // ── Map setup ──────────────────────────────────────────
  const SEOUL = { center: [37.555, 126.98], zoom: 11 };

  const map = L.map('map', {
    center: SEOUL.center,
    zoom:   SEOUL.zoom,
    zoomControl: false,
  });

  L.control.zoom({ position: 'topright' }).addTo(map);

  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
    subdomains: 'abcd',
    maxZoom: 19,
  }).addTo(map);

  // ── Data ───────────────────────────────────────────────
  const KEY = 'seoulmap_pins_v1';
  let pins = [];
  const markerMap = {};

  function load() {
    try {
      const r = JSON.parse(localStorage.getItem(KEY));
      if (Array.isArray(r)) pins = r;
    } catch (_) {}
  }

  function save() {
    localStorage.setItem(KEY, JSON.stringify(pins));
  }

  // ── Marker icon ────────────────────────────────────────
  function makeIcon(num, color) {
    const bg = color || '#2563EB';
    return L.divIcon({
      className: '',
      html: `<div class="m-pin" style="background:${bg}">${num}</div>`,
      iconSize:   [30, 30],
      iconAnchor: [15, 30],
      popupAnchor:[0, -32],
    });
  }

  // ── Render ─────────────────────────────────────────────
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  function render() {
    const list  = document.getElementById('pinList');
    const ids   = new Set(pins.map(p => p.id));

    // remove stale markers
    Object.keys(markerMap).forEach(id => {
      if (!ids.has(id)) { markerMap[id].remove(); delete markerMap[id]; }
    });

    // add / update markers
    pins.forEach((pin, i) => {
      if (!markerMap[pin.id]) {
        const marker = L.marker([pin.lat, pin.lng], { icon: makeIcon(i + 1, pin.color) }).addTo(map);
        marker.bindTooltip(pin.name, { direction: 'top', className: 'pin-tip', offset: [0, -4] });
        marker.on('click', () => {
          map.flyTo([pin.lat, pin.lng], Math.max(map.getZoom(), 13), { duration: 0.7 });
          highlightPin(pin.id);
        });
        markerMap[pin.id] = marker;
      } else {
        markerMap[pin.id].setIcon(makeIcon(i + 1, pin.color));
      }
    });

    // rebuild sidebar list
    list.innerHTML = '';
    updateSidebarCount();

    if (!pins.length) {
      const msg = document.createElement('p');
      msg.id = 'emptyMsg';
      msg.textContent = 'まだピンがありません';
      list.appendChild(msg);
      return;
    }

    pins.forEach((pin, i) => {
      const item = document.createElement('div');
      item.className  = 'pin-item';
      item.dataset.id = pin.id;

      const num = document.createElement('div');
      num.className   = 'pin-num';
      num.textContent = i + 1;
      num.style.background = pin.color || '#2563EB';

      const info = document.createElement('div');
      info.className  = 'pin-info';
      info.innerHTML  = `<div class="pin-name">${esc(pin.name)}</div>`
                      + `<div class="pin-coords">${pin.lat.toFixed(4)}, ${pin.lng.toFixed(4)}</div>`;

      const handle = document.createElement('div');
      handle.className   = 'pin-drag';
      handle.textContent = '⠿';
      handle.setAttribute('title', 'ドラッグして並べ替え');

      const hasInfo = pin.info && Object.values(pin.info).some(v => v);

      const pinColor = pin.color || '#2563EB';
      const colorBtn = document.createElement('button');
      colorBtn.className = 'pin-color-btn';
      colorBtn.setAttribute('aria-label', 'ピンの色を変更');
      colorBtn.setAttribute('title', 'ピンの色を変更');
      colorBtn.innerHTML = `<svg width="13" height="13" viewBox="0 0 13 13"><circle cx="6.5" cy="6.5" r="5.5" fill="${pinColor}" stroke="rgba(0,0,0,0.18)" stroke-width="1"/><circle cx="6.5" cy="6.5" r="2" fill="white" opacity="0.55"/></svg>`;
      colorBtn.addEventListener('click', e => { e.stopPropagation(); openColorPicker(pin.id, colorBtn); });

      const editBtn = document.createElement('button');
      editBtn.className = 'pin-edit-btn' + (hasInfo ? ' has-info' : '');
      editBtn.setAttribute('aria-label', '情報を編集');
      editBtn.textContent = '✎';
      editBtn.addEventListener('click', e => { e.stopPropagation(); openInfoModal(pin.id); });

      const del = document.createElement('button');
      del.className   = 'pin-del';
      del.setAttribute('aria-label', '削除');
      del.textContent = '✕';
      del.addEventListener('click', e => { e.stopPropagation(); deletePin(pin.id); });

      item.append(handle, num, info, colorBtn, editBtn, del);
      setupPinDrag(item, pin.id);
      item.addEventListener('click', () => {
        map.flyTo([pin.lat, pin.lng], Math.max(map.getZoom(), 13), { duration: 0.7 });
        highlightPin(pin.id);
      });
      list.appendChild(item);
    });
  }

  function highlightPin(id) {
    document.querySelectorAll('.pin-item').forEach(el =>
      el.classList.toggle('active', el.dataset.id === id)
    );
  }

  function deletePin(id) {
    pins = pins.filter(p => p.id !== id);
    save(); render();
  }

  // ── Color picker ───────────────────────────────────────
  const PIN_COLORS = [
    '#2563EB', '#EF4444', '#16A34A', '#F97316',
    '#9333EA', '#EC4899', '#EAB308', '#0D9488',
  ];

  const colorPickerEl = document.getElementById('colorPicker');
  let colorPickerTargetId = null;

  PIN_COLORS.forEach(c => {
    const sw = document.createElement('div');
    sw.className        = 'color-swatch';
    sw.dataset.color    = c;
    sw.style.background = c;
    sw.setAttribute('title', c);
    sw.addEventListener('click', () => {
      if (!colorPickerTargetId) return;
      const pin = pins.find(p => p.id === colorPickerTargetId);
      if (!pin) return;
      pin.color = c;
      save(); render();
      closeColorPicker();
    });
    colorPickerEl.appendChild(sw);
  });

  function openColorPicker(pinId, triggerEl) {
    colorPickerTargetId = pinId;
    const pin     = pins.find(p => p.id === pinId);
    const current = (pin && pin.color) || '#2563EB';
    colorPickerEl.querySelectorAll('.color-swatch').forEach(sw =>
      sw.classList.toggle('active', sw.dataset.color === current)
    );
    colorPickerEl.style.display = 'grid';
    const rect = triggerEl.getBoundingClientRect();
    const PW = 138, PH = 75;
    let left = rect.right + 6;
    let top  = rect.top - 10;
    if (left + PW > window.innerWidth)  left = rect.left - PW - 6;
    if (top  + PH > window.innerHeight) top  = window.innerHeight - PH - 8;
    if (top < 4) top = 4;
    colorPickerEl.style.left = `${left}px`;
    colorPickerEl.style.top  = `${top}px`;
  }

  function closeColorPicker() {
    colorPickerEl.style.display = 'none';
    colorPickerTargetId = null;
  }

  document.addEventListener('click', e => {
    if (!e.target.closest('#colorPicker') && !e.target.closest('.pin-color-btn')) {
      closeColorPicker();
    }
  });

  // ── Drag & Drop reorder ────────────────────────────────
  let dragSrcId = null;

  function clearDragStyles() {
    document.querySelectorAll('.pin-item').forEach(el =>
      el.classList.remove('drag-over-top', 'drag-over-bot', 'dragging')
    );
  }

  function setupPinDrag(item, id) {
    item.setAttribute('draggable', 'true');

    item.addEventListener('dragstart', e => {
      dragSrcId = id;
      e.dataTransfer.effectAllowed = 'move';
      setTimeout(() => item.classList.add('dragging'), 0);
    });

    item.addEventListener('dragend', () => {
      dragSrcId = null;
      clearDragStyles();
    });

    item.addEventListener('dragover', e => {
      e.preventDefault();
      if (dragSrcId === id) return;
      const rect = item.getBoundingClientRect();
      clearDragStyles();
      item.classList.add(e.clientY < rect.top + rect.height / 2 ? 'drag-over-top' : 'drag-over-bot');
    });

    item.addEventListener('dragleave', () => {
      item.classList.remove('drag-over-top', 'drag-over-bot');
    });

    item.addEventListener('drop', e => {
      e.preventDefault();
      e.stopPropagation();
      if (!dragSrcId || dragSrcId === id) return;

      const rect   = item.getBoundingClientRect();
      const before = e.clientY < rect.top + rect.height / 2;
      const fromIdx = pins.findIndex(p => p.id === dragSrcId);
      const [moved] = pins.splice(fromIdx, 1);
      const toIdx   = pins.findIndex(p => p.id === id);
      pins.splice(before ? toIdx : toIdx + 1, 0, moved);

      dragSrcId = null;
      save(); render();
    });
  }

  // ── Info modal ─────────────────────────────────────────
  let currentInfoId = null;

  function openInfoModal(id) {
    const pin = pins.find(p => p.id === id);
    if (!pin) return;
    currentInfoId = id;
    document.getElementById('infoTitle').textContent = pin.name;
    const info = pin.info || {};
    document.getElementById('infoTrainTotal').value = info.trainTotal || '';
    document.getElementById('infoTrain').value      = info.train      || '';
    document.getElementById('infoGas').value        = info.gas        || '';
    document.getElementById('infoParking').value    = info.parking    || '';
    document.getElementById('infoHighway').value    = info.highway    || '';
    document.getElementById('infoAddress').value    = info.address    || '';
    const urlVal = info.url || '';
    document.getElementById('infoUrl').value        = urlVal;
    updateUrlBtn(urlVal);
    calcCarTotal();
    document.getElementById('infoOverlay').classList.add('open');
    document.getElementById('infoTrainTotal').focus();
  }

  function parseYen(str) {
    const m = str.replace(/,/g, '').match(/\d+/);
    return m ? parseInt(m[0], 10) : 0;
  }

  function calcCarTotal() {
    const sum = parseYen(document.getElementById('infoGas').value)
              + parseYen(document.getElementById('infoParking').value)
              + parseYen(document.getElementById('infoHighway').value);
    document.getElementById('infoCarTotal').value =
      sum > 0 ? sum.toLocaleString('ja-JP') + ' W' : '';
  }

  ['infoGas', 'infoParking', 'infoHighway'].forEach(id => {
    document.getElementById(id).addEventListener('input', calcCarTotal);
  });

  document.getElementById('infoTrainTotal').addEventListener('blur', () => {
    const el  = document.getElementById('infoTrainTotal');
    const num = parseYen(el.value);
    el.value  = num > 0 ? num.toLocaleString('ja-JP') + ' W' : '';
  });

  function updateUrlBtn(val) {
    const btn = document.getElementById('infoUrlOpen');
    const url = (val !== undefined ? val : document.getElementById('infoUrl').value).trim();
    const valid = url.startsWith('http://') || url.startsWith('https://');
    btn.style.display = valid ? 'flex' : 'none';
    if (valid) btn.href = url;
  }

  document.getElementById('infoUrl').addEventListener('input', () => updateUrlBtn());

  function closeInfoModal() {
    document.getElementById('infoOverlay').classList.remove('open');
    currentInfoId = null;
  }

  document.getElementById('infoSave').addEventListener('click', () => {
    if (!currentInfoId) return;
    const pin = pins.find(p => p.id === currentInfoId);
    if (!pin) return;
    pin.info = {
      trainTotal: document.getElementById('infoTrainTotal').value.trim(),
      train:      document.getElementById('infoTrain').value.trim(),
      gas:        document.getElementById('infoGas').value.trim(),
      parking:    document.getElementById('infoParking').value.trim(),
      highway:    document.getElementById('infoHighway').value.trim(),
      address:    document.getElementById('infoAddress').value.trim(),
      url:        document.getElementById('infoUrl').value.trim(),
    };
    save(); render();
    closeInfoModal();
  });

  document.getElementById('infoClose').addEventListener('click', closeInfoModal);

  document.getElementById('infoOverlay').addEventListener('click', e => {
    if (e.target === document.getElementById('infoOverlay')) closeInfoModal();
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeInfoModal(); closeColorPicker(); setNoteMode(false); setHighlightMode(false); }
  });

  // ── Sticky notes ───────────────────────────────────────
  const NOTES_KEY   = 'seoulmap_notes_v1';
  const NOTE_COLORS = ['#FEF08A', '#FBCFE8', '#BFDBFE', '#BBF7D0', '#FED7AA'];
  let notes = [];
  const noteMarkerMap = {};
  let noteMode = false;

  function loadNotes() {
    try {
      const r = JSON.parse(localStorage.getItem(NOTES_KEY));
      if (Array.isArray(r)) notes = r;
    } catch (_) {}
  }

  function saveNotes() {
    localStorage.setItem(NOTES_KEY, JSON.stringify(notes));
  }

  function updateSidebarCount() {
    const count = document.getElementById('pinCount');
    let text = `${pins.length} ピン`;
    if (notes.length) text += ` ・ ${notes.length} 付箋`;
    if (highlights.length) text += ` ・ ${highlights.length} マーカー`;
    count.textContent = text;
  }

  function makeNoteIcon(note) {
    const dots = NOTE_COLORS.map(c =>
      `<span class="note-color-dot${c === note.color ? ' active' : ''}" data-color="${c}" style="background:${c}"></span>`
    ).join('');
    return L.divIcon({
      className: 'note-icon',
      html: `<div class="sticky-note" style="background:${note.color}">
               <button class="note-del" aria-label="付箋を削除">✕</button>
               <textarea class="note-text" placeholder="メモを入力…" maxlength="200">${esc(note.text)}</textarea>
               <div class="note-colors">${dots}</div>
             </div>`,
      iconSize:   [140, 108],
      iconAnchor: [70, 54],
    });
  }

  function wireNoteEvents(note, marker) {
    const el = marker.getElement();
    if (!el) return;
    const noteEl   = el.querySelector('.sticky-note');
    const textarea = el.querySelector('.note-text');
    const delBtn   = el.querySelector('.note-del');
    const dots     = el.querySelectorAll('.note-color-dot');

    [textarea, delBtn, ...dots].forEach(child => L.DomEvent.disableClickPropagation(child));

    textarea.addEventListener('input', () => {
      note.text = textarea.value;
      saveNotes();
    });

    delBtn.addEventListener('click', () => {
      marker.remove();
      delete noteMarkerMap[note.id];
      notes = notes.filter(n => n.id !== note.id);
      saveNotes();
      updateSidebarCount();
    });

    dots.forEach(dot => {
      dot.addEventListener('click', () => {
        const c = dot.dataset.color;
        note.color = c;
        noteEl.style.background = c;
        dots.forEach(d => d.classList.toggle('active', d.dataset.color === c));
        saveNotes();
      });
    });
  }

  function renderNote(note) {
    const marker = L.marker([note.lat, note.lng], {
      icon: makeNoteIcon(note),
      draggable: true,
    }).addTo(map);

    marker.on('dragend', () => {
      const ll = marker.getLatLng();
      note.lat = ll.lat;
      note.lng = ll.lng;
      saveNotes();
    });

    noteMarkerMap[note.id] = marker;
    wireNoteEvents(note, marker);
    return marker;
  }

  function addNote(latlng) {
    const id = 'n' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
    const note = { id, lat: latlng.lat, lng: latlng.lng, text: '', color: NOTE_COLORS[0] };
    notes.push(note);
    saveNotes();
    const marker = renderNote(note);
    updateSidebarCount();
    setTimeout(() => {
      const ta = marker.getElement() && marker.getElement().querySelector('.note-text');
      if (ta) ta.focus();
    }, 60);
  }

  function setNoteMode(on) {
    noteMode = on;
    document.getElementById('btnAddNote').classList.toggle('active', on);
    document.getElementById('map').classList.toggle('note-mode-active', on);
    if (on) { showToast('地図をクリックして付箋を貼り付け'); setHighlightMode(false); }
  }

  document.getElementById('btnAddNote').addEventListener('click', () => setNoteMode(!noteMode));

  // ── Highlighter (蛍光ペン) ──────────────────────────────
  const HL_KEY    = 'seoulmap_highlights_v1';
  const HL_COLORS = ['#FDE047', '#F472B6', '#86EFAC', '#7DD3FC', '#FDBA74'];
  let highlights  = [];
  const hlLayerMap = {};
  let hlMode      = false;
  let hlEraseMode = false;
  let hlColor     = HL_COLORS[0];
  let hlSize      = 14;
  let hlDrawing   = null;

  function loadHighlights() {
    try {
      const r = JSON.parse(localStorage.getItem(HL_KEY));
      if (Array.isArray(r)) highlights = r;
    } catch (_) {}
  }

  function saveHighlights() {
    localStorage.setItem(HL_KEY, JSON.stringify(highlights));
  }

  function renderHighlight(hl) {
    const line = L.polyline(hl.points, {
      color: hl.color,
      weight: hl.size,
      opacity: 0.5,
      lineCap: 'round',
      lineJoin: 'round',
      className: 'highlighter-stroke',
    }).addTo(map);
    line.on('click', e => {
      if (!hlEraseMode) return;
      L.DomEvent.stopPropagation(e);
      deleteHighlight(hl.id);
    });
    hlLayerMap[hl.id] = line;
    return line;
  }

  function deleteHighlight(id) {
    if (hlLayerMap[id]) { hlLayerMap[id].remove(); delete hlLayerMap[id]; }
    highlights = highlights.filter(h => h.id !== id);
    saveHighlights();
    updateSidebarCount();
  }

  const hlColorsEl = document.getElementById('hlColors');
  HL_COLORS.forEach(c => {
    const dot = document.createElement('button');
    dot.type = 'button';
    dot.className = 'hl-color-dot' + (c === hlColor ? ' active' : '');
    dot.style.background = c;
    dot.dataset.color = c;
    dot.addEventListener('click', () => {
      hlColor = c;
      hlColorsEl.querySelectorAll('.hl-color-dot').forEach(d => d.classList.toggle('active', d.dataset.color === c));
    });
    hlColorsEl.appendChild(dot);
  });

  document.querySelectorAll('.hl-size-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      hlSize = parseInt(btn.dataset.size, 10);
      document.querySelectorAll('.hl-size-btn').forEach(b => b.classList.toggle('active', b === btn));
    });
  });

  function updateHighlightCursor() {
    const mapEl = document.getElementById('map');
    mapEl.classList.toggle('highlight-draw-active', hlMode && !hlEraseMode);
    mapEl.classList.toggle('highlight-erase-active', hlMode && hlEraseMode);
  }

  function setHighlightMode(on) {
    hlMode = on;
    document.getElementById('btnHighlight').classList.toggle('active', on);
    document.getElementById('hlPanel').classList.toggle('open', on);
    if (on) {
      map.dragging.disable();
      setNoteMode(false);
      showToast(hlEraseMode ? 'マーカーをクリックして消す' : 'ドラッグしてマーキング');
    } else {
      map.dragging.enable();
      hlEraseMode = false;
      document.getElementById('btnEraseHl').classList.remove('active');
    }
    updateHighlightCursor();
  }

  document.getElementById('btnHighlight').addEventListener('click', () => setHighlightMode(!hlMode));

  document.getElementById('btnEraseHl').addEventListener('click', () => {
    hlEraseMode = !hlEraseMode;
    document.getElementById('btnEraseHl').classList.toggle('active', hlEraseMode);
    updateHighlightCursor();
    showToast(hlEraseMode ? 'マーカーをクリックして消す' : 'ドラッグしてマーキング');
  });

  const mapEl = document.getElementById('map');

  mapEl.addEventListener('pointerdown', e => {
    if (!hlMode || hlEraseMode) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    e.preventDefault();
    const latlng = map.mouseEventToLatLng(e);
    const id = 'h' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
    const polyline = L.polyline([latlng], {
      color: hlColor, weight: hlSize, opacity: 0.5,
      lineCap: 'round', lineJoin: 'round', className: 'highlighter-stroke',
    }).addTo(map);
    hlDrawing = { id, points: [[latlng.lat, latlng.lng]], polyline };
    mapEl.setPointerCapture(e.pointerId);
  });

  mapEl.addEventListener('pointermove', e => {
    if (!hlDrawing) return;
    const latlng = map.mouseEventToLatLng(e);
    hlDrawing.points.push([latlng.lat, latlng.lng]);
    hlDrawing.polyline.addLatLng(latlng);
  });

  function finishHighlightDrawing() {
    if (!hlDrawing) return;
    if (hlDrawing.points.length < 2) {
      hlDrawing.polyline.remove();
      hlDrawing = null;
      return;
    }
    const hl = { id: hlDrawing.id, color: hlColor, size: hlSize, points: hlDrawing.points };
    highlights.push(hl);
    saveHighlights();
    hlLayerMap[hl.id] = hlDrawing.polyline;
    hlDrawing.polyline.on('click', e => {
      if (!hlEraseMode) return;
      L.DomEvent.stopPropagation(e);
      deleteHighlight(hl.id);
    });
    hlDrawing = null;
    updateSidebarCount();
  }

  mapEl.addEventListener('pointerup', finishHighlightDrawing);
  mapEl.addEventListener('pointercancel', finishHighlightDrawing);

  // ── Add pin (shared by map click / station click / search) ─
  let activePopup = null;

  function openAddPinPopup(latlng, prefillName) {
    const form = document.createElement('div');
    form.className = 'popup-form';

    const input = document.createElement('input');
    input.type      = 'text';
    input.className = 'popup-input';
    input.placeholder = '場所の名前（省略可）';
    input.maxLength   = 30;
    if (prefillName) input.value = prefillName;

    const btn = document.createElement('button');
    btn.className   = 'popup-btn';
    btn.textContent = '追加';

    form.append(input, btn);

    const doAdd = () => {
      const name = input.value.trim() || `ピン ${pins.length + 1}`;
      const id   = Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
      pins.push({ id, lat: latlng.lat, lng: latlng.lng, name });
      save(); render();
      map.closePopup(activePopup);
      activePopup = null;
      setTimeout(() => {
        const el = document.querySelector(`.pin-item[data-id="${id}"]`);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        highlightPin(id);
      }, 60);
    };

    btn.addEventListener('click', doAdd);
    input.addEventListener('keydown', ev => {
      if (ev.key === 'Enter')  doAdd();
      if (ev.key === 'Escape') { map.closePopup(activePopup); activePopup = null; }
    });

    activePopup = L.popup({ className: 'add-popup', closeButton: true, maxWidth: 320 })
      .setLatLng(latlng)
      .setContent(form)
      .openOn(map);

    setTimeout(() => { input.focus(); if (prefillName) input.select(); }, 80);
  }

  map.on('click', e => {
    if (hlMode) return;
    if (noteMode) {
      addNote(e.latlng);
      setNoteMode(false);
    } else {
      openAddPinPopup(e.latlng);
    }
  });
  map.on('popupclose', () => { activePopup = null; });

  // ── Geocoding (Nominatim / OpenStreetMap) ─────────────
  document.getElementById('searchForm').addEventListener('submit', async e => {
    e.preventDefault();
    const query  = document.getElementById('searchInput').value.trim();
    const btn    = document.getElementById('searchBtn');
    const msgEl  = document.getElementById('searchMsg');
    if (!query) return;

    btn.disabled      = true;
    msgEl.className   = 'search-msg info';
    msgEl.textContent = '検索中…';

    try {
      const res  = await fetch(
        `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}&format=json&limit=1&countrycodes=kr`,
        { headers: { 'Accept-Language': 'ko,ja,en' } }
      );
      const data = await res.json();

      if (!data.length) {
        msgEl.className   = 'search-msg err';
        msgEl.textContent = '見つかりませんでした';
        return;
      }

      msgEl.textContent = '';
      const lat    = parseFloat(data[0].lat);
      const lng    = parseFloat(data[0].lon);
      const latlng = L.latLng(lat, lng);
      document.getElementById('searchInput').value = '';

      // 地図が目的地に着いたらピン追加ポップアップを開く
      map.once('moveend', () => openAddPinPopup(latlng, query));
      map.flyTo(latlng, 15, { duration: 1.2 });

    } catch (_) {
      msgEl.className   = 'search-msg err';
      msgEl.textContent = 'ネットワークエラー';
    } finally {
      btn.disabled = false;
    }
  });

  // ── Home button ────────────────────────────────────────
  document.getElementById('btnHome').addEventListener('click', () => {
    map.flyTo(SEOUL.center, SEOUL.zoom, { duration: 0.8 });
  });

  // ── Export ─────────────────────────────────────────────
  document.getElementById('btnExport').addEventListener('click', () => {
    if (!pins.length) { showToast('ピンがありません'); return; }
    const blob = new Blob([JSON.stringify(pins, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `seoulmap_${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
    showToast('エクスポートしました');
  });

  // ── Import ─────────────────────────────────────────────
  document.getElementById('importInput').addEventListener('change', e => {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      let data;
      try { data = JSON.parse(ev.target.result); }
      catch (_) { showToast('読み込み失敗：JSONではありません'); return; }
      if (!Array.isArray(data)) { showToast('読み込み失敗：正しい形式ではありません'); return; }
      const valid = data.filter(p =>
        p.id && typeof p.lat === 'number' && typeof p.lng === 'number' && p.name
      );
      if (!valid.length) { showToast('有効なピンデータがありませんでした'); return; }
      if (pins.length > 0) {
        if (!confirm(`現在の ${pins.length} 件を削除して ${valid.length} 件に置き換えますか？`)) return;
      }
      Object.values(markerMap).forEach(m => m.remove());
      Object.keys(markerMap).forEach(k => delete markerMap[k]);
      pins = valid;
      save(); render();
      map.fitBounds(L.latLngBounds(pins.map(p => [p.lat, p.lng])), { padding: [50, 50] });
      showToast(`${valid.length} 件をインポートしました`);
    };
    reader.readAsText(file);
  });

  // ── Clear all ──────────────────────────────────────────
  document.getElementById('btnClear').addEventListener('click', () => {
    if (!pins.length && !notes.length && !highlights.length) { showToast('ピンも付箋もマーカーもありません'); return; }
    if (!confirm(`ピン${pins.length}件・付箋${notes.length}件・マーカー${highlights.length}件をすべて削除しますか？`)) return;
    Object.values(markerMap).forEach(m => m.remove());
    Object.keys(markerMap).forEach(k => delete markerMap[k]);
    Object.values(noteMarkerMap).forEach(m => m.remove());
    Object.keys(noteMarkerMap).forEach(k => delete noteMarkerMap[k]);
    Object.values(hlLayerMap).forEach(m => m.remove());
    Object.keys(hlLayerMap).forEach(k => delete hlLayerMap[k]);
    pins = []; notes = []; highlights = [];
    save(); saveNotes(); saveHighlights(); render();
  });

  const subwayLayers = {};   // id -> L.layerGroup
  const subwayVisible = {};  // id -> boolean

  function buildSubwayLayer(line) {
    const group = L.layerGroup();
    const latlngs = line.stations.map(s => [s[1], s[2]]);
    if (line.loop) latlngs.push(latlngs[0]);

    L.polyline(latlngs, {
      color: '#ffffff', weight: 6, opacity: 0.85,
      lineCap: 'round', lineJoin: 'round',
    }).addTo(group);
    L.polyline(latlngs, {
      color: line.color, weight: 3, opacity: 0.95,
      lineCap: 'round', lineJoin: 'round',
    }).addTo(group);

    line.stations.forEach(s => {
      const [name, lat, lon, majorFlag] = s;
      const major = majorFlag === 1;
      const marker = L.circleMarker([lat, lon], {
        radius: major ? 5 : 3.2,
        weight: major ? 2.2 : 1.6,
        color: line.color,
        fillColor: '#ffffff',
        fillOpacity: 1,
      }).addTo(group);
      marker.bindTooltip(name, {
        permanent: true,
        direction: 'right',
        offset: [6, 0],
        className: 'st-tip' + (major ? ' major' : ' minor'),
      });
      marker.on('click', e => {
        L.DomEvent.stopPropagation(e);
        openAddPinPopup(e.latlng, name);
      });
    });

    return group;
  }

  SUBWAY_LINES.forEach(line => {
    subwayLayers[line.id] = buildSubwayLayer(line);
    subwayVisible[line.id] = true;
    subwayLayers[line.id].addTo(map);
  });

  function applyLabelZoom() {
    const z = map.getZoom();
    document.getElementById('map').classList.toggle('show-major', z >= 11);
    document.getElementById('map').classList.toggle('show-minor', z >= 13);
  }
  map.on('zoomend', applyLabelZoom);
  applyLabelZoom();

  // ── 路線トグルUI ────────────────────────────────────────
  const linesGrid = document.getElementById('linesGrid');
  SUBWAY_LINES.forEach(line => {
    const chip = document.createElement('div');
    chip.className = 'line-chip';
    chip.innerHTML = `<span class="dot" style="background:${line.color}"></span>${line.name}`;
    chip.addEventListener('click', () => {
      subwayVisible[line.id] = !subwayVisible[line.id];
      chip.classList.toggle('off', !subwayVisible[line.id]);
      if (subwayVisible[line.id]) subwayLayers[line.id].addTo(map);
      else map.removeLayer(subwayLayers[line.id]);
    });
    linesGrid.appendChild(chip);
  });

  // ── Init ───────────────────────────────────────────────
  load();
  render();
  loadNotes();
  notes.forEach(renderNote);
  loadHighlights();
  highlights.forEach(renderHighlight);
  updateSidebarCount();
  if (pins.length) {
    map.fitBounds(L.latLngBounds(pins.map(p => [p.lat, p.lng])), { padding: [60, 60] });
  }
