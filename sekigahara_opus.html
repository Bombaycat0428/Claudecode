<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>関ヶ原 天下分け目 — 3D俯瞰ドキュメント</title>
<meta name="description" content="慶長五年九月十五日、関ヶ原の合戦をテレビ特番風の3D俯瞰演出で再現。地形・軍勢・進軍矢印・霧・カメラワーク。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Cinzel:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --east:#e5412f; --west:#2f7fe6; --turn:#f39a1e; --still:#7c8ca4; --gold:#d9b66b;
  --ink:#060709; --paper:#f1ebdf; --mute:rgba(241,235,223,.62);
  --lb:clamp(44px,7.5vh,74px);
  --min:'Shippori Mincho B1','Hiragino Mincho ProN','Yu Mincho',serif;
  --sans:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic UI',system-ui,sans-serif;
  --lat:'Cinzel',Georgia,serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--ink);color:var(--paper);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#vig{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(0,0,0,.5) 100%)}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.lbx{position:fixed;left:0;right:0;height:var(--lb);background:#030304;z-index:6}
#lbT{top:0}#lbB{bottom:0}
#hud{position:fixed;left:0;right:0;top:var(--lb);bottom:var(--lb);pointer-events:none;z-index:4;opacity:0;transition:opacity 1s}
#hud.on{opacity:1}

/* unit labels */
.ul{position:absolute;left:0;top:0;display:none;flex-direction:column;align-items:center;will-change:transform,opacity}
.ul.on{display:flex}
.ul[data-s=E]{--c:var(--east)}.ul[data-s=W]{--c:var(--west)}.ul[data-s=Wp]{--c:var(--still)}.ul[data-s=T]{--c:var(--turn)}
.ub{display:flex;align-items:baseline;gap:7px;padding:3px 9px 4px 8px;background:rgba(6,8,12,.74);border-left:3px solid var(--c);white-space:nowrap}
.un{font-family:var(--min);font-weight:700;font-size:13px;letter-spacing:.06em}
.ut{font-family:var(--lat);font-size:11px;color:rgba(241,235,223,.72);letter-spacing:.04em}
.ul.major .un{font-size:15px}
.ux{margin-top:3px;font-size:10px;font-weight:700;letter-spacing:.14em;padding:1px 7px;border-radius:2px;display:none}
.ux.n{display:block;background:rgba(124,140,164,.9);color:#0b0e14}
.ux.alert{display:block;background:#ffcf4a;color:#1b1300}
.ux.dead{display:block;background:#8e1b16;color:#ffe2dc}
.ux.hq{display:block;background:var(--gold);color:#1a1204}
.up{width:1px;height:12px;background:linear-gradient(var(--c),transparent);margin-top:2px}

/* callouts */
.co{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;opacity:0;transition:opacity .5s;pointer-events:none;visibility:hidden}
.co.on{opacity:1;visibility:visible}
.co[data-k=e]{--k:#c8321f}.co[data-k=w]{--k:#1f64c4}.co[data-k=t]{--k:#e0850c}.co[data-k=g]{--k:#b8891f}.co[data-k=n]{--k:#56647a}.co[data-k=d]{--k:#8e1b16}
.co .cb{padding:6px 16px 7px;background:var(--k);color:#fff;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.co .cb b{display:block;font-family:var(--min);font-weight:800;font-size:18px;letter-spacing:.14em;white-space:nowrap}
.co .cb span{display:block;font-size:11px;font-weight:500;letter-spacing:.08em;margin-top:1px;opacity:.92;white-space:nowrap}
.co .cl{width:2px;height:28px;background:var(--k)}
.co .cd{width:9px;height:9px;border-radius:50%;background:var(--k);box-shadow:0 0 0 5px color-mix(in srgb,var(--k) 35%,transparent)}

/* landmarks */
.lm{position:absolute;left:0;top:0;white-space:nowrap;font-family:var(--min);font-size:12px;letter-spacing:.24em;color:rgba(241,235,223,.86);text-shadow:0 1px 3px #000,0 0 10px rgba(0,0,0,.7);display:none}
.lm.on{display:block}
.lm.mt::before{content:'▲';font-size:8px;margin-right:5px;color:var(--gold)}
.lm small{font-family:var(--lat);font-size:10px;letter-spacing:.05em;opacity:.7;margin-left:6px}
.lm.rd{font-family:var(--sans);font-weight:500;font-size:11px;color:rgba(236,220,186,.85);letter-spacing:.4em}
.lm.rv{color:rgba(170,205,215,.9);font-size:11px}
.lm.far{font-size:13px;opacity:.8}

/* HUD */
#brand{position:absolute;left:clamp(16px,3vw,44px);top:16px;display:flex;align-items:center;gap:12px}
.seal{width:38px;height:38px;display:grid;place-items:center;background:#a8281a;color:#f7e9d4;font-family:var(--min);font-weight:800;font-size:22px;border-radius:3px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.18)}
.bt{font-family:var(--min);font-weight:800;font-size:20px;letter-spacing:.3em}
.bs{font-family:var(--lat);font-size:10px;letter-spacing:.42em;color:var(--gold);margin-top:2px}
#chapLine{position:absolute;left:clamp(16px,3vw,44px);top:66px;font-family:var(--min);font-size:13px;letter-spacing:.2em;color:var(--mute)}
#chapLine .no{color:var(--gold);margin-right:.8em}
#forces{position:absolute;left:50%;top:14px;transform:translateX(-50%);display:grid;grid-template-columns:auto 260px auto;align-items:center;gap:6px 12px}
.fbar{height:8px;display:flex;background:#111;overflow:hidden;border-radius:1px;box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.fbar i{display:block;height:100%;transition:width .5s}
#bE{background:var(--east)}#bW{background:var(--west)}#bS{background:repeating-linear-gradient(45deg,#5d6a80 0 4px,#434c5b 4px 8px)}
.fl,.fr{display:flex;align-items:baseline;gap:8px;font-family:var(--min);font-weight:700;font-size:14px;text-shadow:0 1px 4px #000}
.fl b,.fr b{font-family:var(--lat);font-size:18px;font-weight:600;letter-spacing:.04em;min-width:4.2em}
.fl b{text-align:right}
.fe{color:#ff6b57}.fw{color:#5ea2ff}
.fs{grid-column:1/-1;text-align:center;font-size:11px;color:var(--mute);letter-spacing:.2em;text-shadow:0 1px 3px #000}
.fs b{font-family:var(--lat);font-weight:600;color:#aab6c8}
#clock{position:absolute;right:clamp(16px,3vw,44px);top:12px;text-align:right;text-shadow:0 1px 4px #000}
#clock .d{font-family:var(--min);font-size:12px;letter-spacing:.24em;color:var(--mute)}
#clock .t{display:flex;align-items:baseline;justify-content:flex-end;gap:10px;margin-top:2px}
#koku{font-family:var(--min);font-size:14px;letter-spacing:.2em;color:var(--gold)}
#hhmm{font-family:var(--lat);font-size:34px;font-weight:600;letter-spacing:.04em;line-height:1}
#clock .w{font-size:11px;letter-spacing:.3em;color:var(--mute);margin-top:4px}
#card{position:absolute;left:clamp(20px,6vw,90px);top:26%;opacity:0;transition:opacity .9s}
#card.on{opacity:1}
#card .en{font-family:var(--lat);font-size:13px;letter-spacing:.55em;color:var(--gold)}
#card .no{font-family:var(--min);font-size:18px;letter-spacing:.5em;margin-top:10px;color:rgba(241,235,223,.88)}
#card .tt{font-family:var(--min);font-weight:800;font-size:clamp(34px,5.2vw,70px);letter-spacing:.14em;margin-top:4px;text-shadow:0 4px 30px rgba(0,0,0,.8)}
#card .tt span{display:inline-block;opacity:0;transform:translateY(14px);filter:blur(8px);transition:opacity .7s,transform .7s,filter .7s}
#card.on .tt span{opacity:1;transform:none;filter:none}
#card .ln{height:2px;width:0;background:linear-gradient(90deg,var(--gold),transparent);margin-top:14px;transition:width 1.6s cubic-bezier(.2,.7,.2,1)}
#card.on .ln{width:min(440px,70vw)}
#cap{position:absolute;left:clamp(16px,3vw,44px);bottom:20px;max-width:min(700px,calc(100% - 360px));opacity:0;transform:translateY(10px);transition:opacity .45s,transform .45s}
#cap.on{opacity:1;transform:none}
#cap .h{display:inline-block;font-family:var(--min);font-weight:800;font-size:clamp(17px,2vw,24px);letter-spacing:.12em;padding:6px 26px 7px 14px;background:linear-gradient(90deg,#7d1c14,#b0301f 65%,rgba(176,48,31,0));border-left:4px solid var(--gold);text-shadow:0 1px 2px rgba(0,0,0,.5)}
#cap .b{margin-top:6px;font-size:clamp(13px,1.3vw,16px);line-height:1.9;letter-spacing:.04em;padding:10px 16px;background:rgba(6,8,12,.72);backdrop-filter:blur(4px)}
#mini{position:absolute;right:clamp(16px,3vw,44px);bottom:20px;padding:6px;background:rgba(6,8,12,.72);box-shadow:0 0 0 1px rgba(217,182,107,.35)}
#mm{display:block;width:260px;height:195px}
#mini .mt{position:absolute;left:12px;top:9px;font-family:var(--min);font-size:11px;letter-spacing:.3em;color:var(--gold);text-shadow:0 1px 3px #000}
#backCam{position:absolute;left:50%;top:78px;transform:translateX(-50%);pointer-events:auto;display:none;padding:8px 18px;background:rgba(6,8,12,.8);border:1px solid var(--gold);color:var(--gold);font-family:var(--min);font-weight:700;letter-spacing:.2em;font-size:13px}
#backCam.on{display:block}

/* bar */
#bar{position:fixed;left:0;right:0;bottom:0;height:var(--lb);z-index:7;display:none;align-items:center;gap:4px;padding:0 clamp(8px,2vw,28px)}
#bar.on{display:flex}
#bar button{height:34px;min-width:34px;padding:0 8px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:4px;color:rgba(241,235,223,.82);font-size:12px;letter-spacing:.08em;white-space:nowrap}
#bar button:hover{background:rgba(255,255,255,.08);color:#fff}
#bar button.act{color:var(--gold)}
#bar button.off{opacity:.45}
#bar svg{width:18px;height:18px;fill:currentColor;flex:none}
#tl{flex:1;position:relative;height:34px;display:flex;align-items:center;cursor:pointer;margin:0 10px;touch-action:none}
#tlTrack{position:relative;height:4px;width:100%;background:rgba(255,255,255,.14);border-radius:2px}
#tlFill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#9c7a37,var(--gold));border-radius:2px}
#tlHead{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 0 0 4px rgba(217,182,107,.3)}
.tm{position:absolute;top:-4px;width:2px;height:12px;background:rgba(241,235,223,.4)}
#tlTip{position:absolute;bottom:30px;transform:translateX(-50%);white-space:nowrap;font-size:12px;padding:4px 10px;background:rgba(6,8,12,.94);border:1px solid rgba(217,182,107,.45);font-family:var(--min);letter-spacing:.1em;opacity:0;pointer-events:none;transition:opacity .15s}
#tl:hover #tlTip{opacity:1}
#tlTime{font-family:var(--lat);font-size:12px;color:var(--mute);min-width:96px;text-align:center}

#fade{position:fixed;inset:0;background:#000;z-index:15;opacity:0;pointer-events:none;transition:opacity .7s}
#fade.on{opacity:1}
.ov{position:fixed;inset:0;z-index:20;display:grid;place-items:center;transition:opacity .8s}
.ov.hide{opacity:0;pointer-events:none}
#intro{background:radial-gradient(ellipse at 50% 55%,rgba(6,7,10,.25),rgba(6,7,10,.92))}
#end{background:rgba(4,5,7,.55);opacity:0;pointer-events:none}
#end.on{opacity:1;pointer-events:auto}
.in-wrap{text-align:center;padding:24px;max-width:760px}
.in-en{font-family:var(--lat);letter-spacing:.6em;color:var(--gold);font-size:13px}
.in-tt{font-family:var(--min);font-weight:800;font-size:clamp(64px,13vw,150px);letter-spacing:.12em;line-height:1.05;margin:14px 0 8px;text-shadow:0 10px 60px rgba(0,0,0,.9)}
.in-sub{font-family:var(--min);font-size:clamp(14px,1.8vw,19px);letter-spacing:.28em;color:rgba(241,235,223,.88)}
.in-btns{margin-top:36px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{padding:13px 28px;border:1px solid rgba(217,182,107,.6);font-family:var(--min);font-weight:700;letter-spacing:.2em;font-size:15px;background:rgba(10,10,12,.55);transition:transform .25s,filter .25s}
.btn.pri{background:linear-gradient(180deg,#b3301f,#7d1c14);border-color:#d4553f}
.btn:hover{transform:translateY(-1px);filter:brightness(1.15)}
.btn:disabled{opacity:.4;cursor:wait}
.in-load{margin-top:26px;font-size:12px;letter-spacing:.3em;color:var(--mute)}
.in-note{margin-top:22px;font-size:11px;color:var(--mute);letter-spacing:.08em;line-height:1.9}
kbd{font-family:var(--lat);font-size:10px;padding:1px 5px;border:1px solid rgba(241,235,223,.3);border-radius:3px}

@media (max-width:1100px){#forces{grid-template-columns:auto 150px auto}.fl b,.fr b{font-size:15px}}
@media (max-width:760px){
  :root{--lb:52px}
  #mini,#chapLine,.bs,#bar .tx,#tlTime{display:none}
  #forces{top:62px;left:16px;transform:none;grid-template-columns:auto 90px auto;gap:4px 8px}
  .fl,.fr{font-size:11px}.fl b,.fr b{font-size:13px;min-width:0}
  #clock{top:10px}#hhmm{font-size:24px}#clock .d{font-size:10px;letter-spacing:.1em}
  #brand{top:12px}.bt{font-size:16px}.seal{width:30px;height:30px;font-size:17px}
  #cap{max-width:calc(100% - 32px);left:16px;bottom:12px}
  #cap .b{line-height:1.7;padding:8px 12px}
  #card{top:30%;left:16px}
  #backCam{top:118px}
}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="labels"></div>
<div id="vig"></div>
<div id="lbT" class="lbx"></div><div id="lbB" class="lbx"></div>

<div id="hud">
  <div id="brand"><div class="seal">関</div><div><div class="bt">関ヶ原</div><div class="bs">SEKIGAHARA 1600</div></div></div>
  <div id="chapLine"><span class="no"></span><span class="tt"></span></div>
  <div id="forces">
    <div class="fl"><span class="fe">東軍</span><b id="fE">0</b></div>
    <div class="fbar"><i id="bE"></i><i id="bW"></i><i id="bS"></i></div>
    <div class="fr"><b id="fW">0</b><span class="fw">西軍</span></div>
    <div class="fs">静観・去就不明 <b id="fS">0</b></div>
  </div>
  <div id="clock"><div class="d">慶長五年九月十五日</div><div class="t"><span id="koku">子の刻</span><b id="hhmm">00:30</b></div><div class="w" id="wx">—</div></div>
  <div id="card"><div class="en"></div><div class="no"></div><div class="tt"></div><div class="ln"></div></div>
  <div id="cap"><div class="h"></div><div class="b"></div></div>
  <div id="mini"><canvas id="mm"></canvas><div class="mt">戦況図</div></div>
  <button id="backCam">演出カメラに戻る</button>
</div>

<div id="bar">
  <button id="bPrev" title="前の章（←）"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5L9 12l11 7z"/></svg></button>
  <button id="bPlay" title="再生／一時停止（Space）"><svg viewBox="0 0 24 24"><path id="pIcon" d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg></button>
  <button id="bNext" title="次の章（→）"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5l11 7-11 7z"/></svg></button>
  <div id="tl"><div id="tlTrack"><div id="tlFill"></div><div id="tlMarks"></div><div id="tlHead"></div></div><div id="tlTip"></div></div>
  <span id="tlTime">0:00 / 0:00</span>
  <button id="bSpd" title="再生速度">1×</button>
  <button id="bCam" title="自由視点（F）：ドラッグで回転、ホイールで拡大"><svg viewBox="0 0 24 24"><path d="M12 5C6 5 2 12 2 12s4 7 10 7 10-7 10-7-4-7-10-7zm0 11a4 4 0 110-8 4 4 0 010 8z"/></svg><span class="tx">自由視点</span></button>
  <button id="bLbl" class="act" title="ラベル表示（L）"><svg viewBox="0 0 24 24"><path d="M3 4h10l8 8-9 9-9-9zM7.5 9a1.5 1.5 0 100-3 1.5 1.5 0 000 3z"/></svg><span class="tx">ラベル</span></button>
  <button id="bSnd" title="音声（M）"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4zM16 8.5a5 5 0 010 7l-1.4-1.4a3 3 0 000-4.2zM18.5 6a8.5 8.5 0 010 12l-1.4-1.4a6.5 6.5 0 000-9.2z"/></svg><span class="tx">音</span></button>
  <button id="bFs" title="全画面"><svg viewBox="0 0 24 24"><path d="M4 4h6v2H6v4H4zM14 4h6v6h-2V6h-4zM4 14h2v4h4v2H4zM18 14h2v6h-6v-2h4z"/></svg></button>
</div>

<div id="fade"></div>

<div id="intro" class="ov">
  <div class="in-wrap">
    <div class="in-en">THE BATTLE OF SEKIGAHARA · 1600</div>
    <div class="in-tt">関ヶ原</div>
    <div class="in-sub">天下分け目の一日を、空から見る</div>
    <div class="in-btns">
      <button class="btn pri" id="goSnd" disabled>再生する（音あり）</button>
      <button class="btn" id="goMute" disabled>音なしで再生</button>
    </div>
    <div class="in-load" id="load">地形を生成しています…</div>
    <div class="in-note">約3分20秒 ／ <kbd>Space</kbd> 一時停止 <kbd>←</kbd><kbd>→</kbd> 章移動 <kbd>F</kbd> 自由視点 <kbd>L</kbd> ラベル<br>画面をドラッグすると自由視点に切り替わります</div>
  </div>
</div>

<div id="end" class="ov">
  <div class="in-wrap">
    <div class="in-en">FIN</div>
    <div class="in-tt" style="font-size:clamp(56px,10vw,110px)">完</div>
    <div class="in-sub">慶長五年九月十五日　関ヶ原</div>
    <div class="in-btns">
      <button class="btn pri" id="again">もう一度見る</button>
      <button class="btn" id="explore">自由視点で眺める</button>
    </div>
    <div class="in-note">布陣・兵力・経過は江戸時代以来の通説にもとづく演出です。<br>近年の研究では、小早川秀秋は開戦直後に寝返った、問鉄砲は後世の創作、などの説もあります。</div>
  </div>
</div>

/* ============================================================

const $ = s => document.querySelector(s);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const smoother = t => t * t * t * (t * (t * 6 - 15) + 10);
const easeOut = t => 1 - Math.pow(1 - t, 3);
function hash2(x, y) { let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y, o = 5) { let s = 0, a = 0.5, f = 1, n = 0; for (let i = 0; i < o; i++) { s += a * vnoise(x * f, y * f); n += a; f *= 2.03; a *= 0.5; } return s / n; }
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function segDist(px, py, ax, ay, bx, by) { const dx = bx - ax, dy = by - ay, l = dx * dx + dy * dy; let t = l ? ((px - ax) * dx + (py - ay) * dy) / l : 0; t = clamp(t, 0, 1); const qx = ax + dx * t - px, qy = ay + dy * t - py; return Math.sqrt(qx * qx + qy * qy); }
function polyDist(p, x, y) { let d = 1e9; for (let i = 0; i < p.length - 1; i++) { const s = segDist(x, y, p[i][0], p[i][1], p[i + 1][0], p[i + 1][1]); if (s < d) d = s; } return d; }
function at(arr, c) { let v = arr[0]; for (const e of arr) { if (e[0] <= c) v = e; else break; } return v; }

function hMeters(x, n) {
  const r = fbm(x * 0.8 + 11.3, n * 0.8 + 7.1, 5), q = fbm(x * 2.4 - 3.7, n * 2.4 + 5.9, 4);
  let m = Math.max(sstep(-2.1, -3.5, x), sstep(2.1, 3.8, n) * 1.05, sstep(-2.6, -3.9, n) * (1 - 0.7 * sstep(4.6, 6.0, x)));
  const dr = Math.min(polyDist(ROADS.naka, x, n), polyDist(ROADS.hokkoku, x, n), polyDist(ROADS.ise, x, n));
  m *= 1 - 0.88 * Math.exp(-((dr / 0.5) ** 2));
  let h = m * (200 + 300 * r + 80 * q);
  for (const k of HILLS) { const dx = (x - k[0]) / k[2], dn = (n - k[1]) / k[3]; h += k[4] * Math.exp(-(dx * dx + dn * dn)) * (0.85 + 0.3 * q); }
  h += (r - 0.5) * 14 + (q - 0.5) * 6 - x * 3;
  const dv = Math.min(polyDist(RIVERS.fuji, x, n), polyDist(RIVERS.ai, x, n));
  h -= 5 * Math.exp(-((dv / 0.06) ** 2));
  return h;
}
const HM = new Float32Array(NX * NX);
function hmAt(x, n) {
  const fx = clamp((x - X0) / GW * SEG, 0, SEG - 1e-4), fz = clamp((n - N0) / GH * SEG, 0, SEG - 1e-4);
  const i = fx | 0, j = fz | 0, u = fx - i, v = fz - j, o = j * NX + i;
  const a = HM[o], b = HM[o + 1], c = HM[o + NX], d = HM[o + NX + 1];
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
const groundY = (wx, wz) => hmAt(wx / KM, -wz / KM) * VS;

function evalKf(kf, c) {
  if (c <= kf[0][0]) return kf[0];
  const L = kf[kf.length - 1]; if (c >= L[0]) return L;
  for (let i = 1; i < kf.length; i++) if (c <= kf[i][0]) {
    const a = kf[i - 1], b = kf[i], t = (c - a[0]) / ((b[0] - a[0]) || 1);
    return [c, lerp(a[1], b[1], t), lerp(a[2], b[2], t), lerp(a[3], b[3], t)];
  }
  return L;
}

  const len = ctx.sampleRate * 2, brown = ctx.createBuffer(1, len, ctx.sampleRate), bd = brown.getChannelData(0); let last = 0;
  for (let i = 0; i < len; i++) { last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; bd[i] = last * 3.5; }
  const white = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate), wd = white.getChannelData(0); for (let i = 0; i < wd.length; i++) wd[i] = Math.random() * 2 - 1;
  AU.white = white;
  const src = ctx.createBufferSource(); src.buffer = brown; src.loop = true;
  const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 420;
  AU.wind = ctx.createGain(); AU.wind.gain.value = 0.1; src.connect(lp).connect(AU.wind).connect(AU.master); src.start();
}
function setSound(on) { AU.on = on; $('#bSnd').classList.toggle('off', !on); if (AU.ctx) AU.master.gain.setTargetAtTime(on ? 0.8 : 0, AU.ctx.currentTime, 0.1); }
function taiko(st = 1, delay = 0) {
  const ctx = AU.ctx; if (!ctx || !AU.on) return; const t = ctx.currentTime + delay;
  const o = ctx.createOscillator(); o.frequency.setValueAtTime(115, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.5);
  const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.9 * st, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.3);
  o.connect(g).connect(AU.master); o.start(t); o.stop(t + 1.4);
  const n = ctx.createBufferSource(); n.buffer = AU.white; const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 190; bp.Q.value = 0.8;
  const ng = ctx.createGain(); ng.gain.setValueAtTime(0.55 * st, t); ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
  n.connect(bp).connect(ng).connect(AU.master); n.start(t); n.stop(t + 0.3);
}
const taikoRoll = () => { taiko(1, 0); taiko(0.55, 0.28); taiko(1.15, 0.56); };
function pop() {
  const ctx = AU.ctx, t = ctx.currentTime + Math.random() * 0.05;
  const s = ctx.createBufferSource(); s.buffer = AU.white; const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 600 + Math.random() * 1400; bp.Q.value = 0.9;
  const g = ctx.createGain(); g.gain.setValueAtTime(0.04 + Math.random() * 0.07, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.15 + Math.random() * 0.25);
  s.connect(bp).connect(g).connect(AU.master); s.start(t, Math.random() * 0.5, 0.45);
}

/* ============================================================
   camera director + free camera
   ============================================================ */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08; controls.maxPolarAngle = 1.46; controls.minDistance = 30; controls.maxDistance = 2600;
const camPos = new THREE.Vector3(800, 400, 800), camTgt = new THREE.Vector3(), vP = new THREE.Vector3(), vT = new THREE.Vector3();
let free = false, snapCam = true, attractA = 0.6;
function setFree(on) {
  free = on; $('#bCam').classList.toggle('act', on); $('#backCam').classList.toggle('on', on && started);
  if (!on) { camPos.copy(camera.position); camTgt.copy(controls.target); }
}
controls.addEventListener('change', () => { if (!free && started && !directing) setFree(true); });
let directing = false;
function shotAt(s, a) {
  const k = s.shots; let A = k[0], B = k[0], u = 0;
  if (a >= k[k.length - 1].a) A = B = k[k.length - 1];
  else for (let i = 0; i < k.length - 1; i++) if (a >= k[i].a && a <= k[i + 1].a) { A = k[i]; B = k[i + 1]; u = smoother((a - A.a) / (B.a - A.a)); break; }
  const px = lerp(A.p[0], B.p[0], u), pn = lerp(A.p[1], B.p[1], u), py = lerp(A.p[2], B.p[2], u);
  const tx = lerp(A.t[0], B.t[0], u), tn = lerp(A.t[1], B.t[1], u), ty = lerp(A.t[2], B.t[2], u);
  vP.set(px * KM, py, -pn * KM); vT.set(tx * KM, groundY(tx * KM, -tn * KM) + ty, -tn * KM);
}
function updateCamera(L, dt) {
  if (free) { controls.update(); const gy = groundY(camera.position.x, camera.position.z) + 12; if (camera.position.y < gy) camera.position.y = gy; camTgt.copy(controls.target); return; }
  if (!started) { attractA += dt * 0.035; vP.set(80 + Math.cos(attractA) * 760, 330, -40 + Math.sin(attractA) * 760); vT.set(-20, 5, 20); }
  else shotAt(L.s, L.a);
  const kp = snapCam ? 1 : 1 - Math.exp(-1.6 * dt), kt = snapCam ? 1 : 1 - Math.exp(-2.2 * dt); snapCam = false;
  camPos.lerp(vP, kp); camTgt.lerp(vT, kt);
  camera.position.set(camPos.x + Math.sin(time * 0.13) * 3, camPos.y + Math.sin(time * 0.17) * 2, camPos.z + Math.cos(time * 0.11) * 3);
  const gy = groundY(camera.position.x, camera.position.z) + 18; if (camera.position.y < gy) camera.position.y = gy;
  camera.lookAt(camTgt);
  directing = true; controls.target.copy(camTgt); directing = false;
}

/* ============================================================
   playback & UI
   ============================================================ */
let T = 0, playing = false, started = false, speed = 1, lastIdx = -1, lastBeat = null;
const fmt = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
function setPlaying(p) { playing = p; $('#pIcon').setAttribute('d', p ? 'M7 5h4v14H7zM13 5h4v14h-4z' : 'M7 5l12 7-12 7z'); }
function seek(t) { T = clamp(t, 0, TOTAL); if (T < TOTAL) $('#end').classList.remove('on'); }
function jumpScene(d) {
  const L = locate(T); let i = L.i + d;
  if (d < 0 && L.a > 0.08) i = L.i;
  i = clamp(i, 0, SCENES.length - 1); seek(SCENES[i].start + 0.001); if (!playing) setPlaying(true);
}
function buildTimeline() {
  const marks = $('#tlMarks');
  for (const s of SCENES) { const m = document.createElement('i'); m.className = 'tm'; m.style.left = (s.start / TOTAL * 100) + '%'; marks.appendChild(m); }
  const tl = $('#tl'), tip = $('#tlTip');
  const frac = e => { const r = $('#tlTrack').getBoundingClientRect(); return clamp((e.clientX - r.left) / r.width, 0, 1); };
  let drag = false;
  tl.addEventListener('pointerdown', e => { drag = true; tl.setPointerCapture(e.pointerId); seek(frac(e) * TOTAL); });
  tl.addEventListener('pointermove', e => {
    const f = frac(e), L = locate(f * TOTAL); tip.textContent = L.s.no + '　' + L.s.title;
    tip.style.left = (f * 100) + '%'; if (drag) seek(f * TOTAL);
  });
  tl.addEventListener('pointerup', () => { drag = false; });
}
function startShow(withSound) {
  setSound(withSound); audioInit(); if (AU.ctx && AU.ctx.state === 'suspended') AU.ctx.resume();
  $('#fade').classList.add('on');
  setTimeout(() => {
    started = true; T = 0; lastIdx = -1; snapCam = true; setFree(false); setPlaying(true);
    $('#intro').classList.add('hide'); $('#bar').classList.add('on'); $('#hud').classList.add('on');
    $('#fade').classList.remove('on');
  }, 750);
}
$('#goSnd').onclick = () => startShow(true);
$('#goMute').onclick = () => startShow(false);
$('#bPlay').onclick = () => { if (T >= TOTAL) seek(0); setPlaying(!playing); };
$('#bPrev').onclick = () => jumpScene(-1);
$('#bNext').onclick = () => jumpScene(1);
$('#bSpd').onclick = () => { speed = speed === 1 ? 2 : speed === 2 ? 0.5 : 1; $('#bSpd').textContent = speed + '×'; };
$('#bCam').onclick = () => setFree(!free);
$('#backCam').onclick = () => setFree(false);
$('#bLbl').onclick = () => { labelsOn = !labelsOn; $('#bLbl').classList.toggle('act', labelsOn); };
$('#bSnd').onclick = () => { audioInit(); if (AU.ctx && AU.ctx.state === 'suspended') AU.ctx.resume(); setSound(!AU.on); };
$('#bFs').onclick = () => { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.(); };
$('#again').onclick = () => { $('#end').classList.remove('on'); seek(0); lastIdx = -1; setFree(false); setPlaying(true); };
$('#explore').onclick = () => { $('#end').classList.remove('on'); setFree(true); };
addEventListener('keydown', e => {
  if (!started || e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); $('#bPlay').click(); }
  else if (e.code === 'ArrowRight') jumpScene(1);
  else if (e.code === 'ArrowLeft') jumpScene(-1);
  else if (e.key === 'f' || e.key === 'F') setFree(!free);
  else if (e.key === 'l' || e.key === 'L') $('#bLbl').click();
  else if (e.key === 'm' || e.key === 'M') $('#bSnd').click();
});
function onResize() {
  SW = innerWidth; SH = innerHeight; renderer.setSize(SW, SH, false); camera.aspect = SW / SH; camera.updateProjectionMatrix();
  const sc = renderer.domElement.height / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
  for (const f of [smoke, flash, torch]) f.mat.uniforms.uScale.value = sc;
}
addEventListener('resize', onResize);

/* ============================================================
   main loop
   ============================================================ */
let lastT = 0, snapUnits = true;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - (lastT || now)) / 1000); lastT = now; time += dt;
  if (started && playing) { T += dt * speed; if (T >= TOTAL) { T = TOTAL; setPlaying(false); $('#end').classList.add('on'); } }
  const L = started ? locate(T) : { i: -1, s: null, a: 0, clock: 10.2 };
  if (started) {
    if (L.i !== lastIdx) { lastIdx = L.i; lastBeat = null; showCard(L.s); taikoRoll(); }
    let b = null; for (const x of L.s.beats) if (x.a <= L.a) b = x;
    if (b !== lastBeat) { lastBeat = b; if (b) showBeat(b); }
    $('#tlFill').style.width = (T / TOTAL * 100) + '%'; $('#tlHead').style.left = (T / TOTAL * 100) + '%';
    $('#tlTime').textContent = fmt(T) + ' / ' + fmt(TOTAL);
  }
  if (cardUntil && now > cardUntil) { $('#card').classList.remove('on'); cardUntil = 0; }
  updateEnv(L.clock);
  updateUnits(L.clock, dt, snapUnits); snapUnits = false;
  effects(L.clock, dt); smoke.update(dt); flash.update(dt);
  for (const a of ARROWS) a.update(started ? T : -1);
  updateCamera(L, dt);
  updateMist(dt);
  sky.position.copy(camera.position);
  flagTime.value = time; arrowTime.value = time;
  updateLabels(L, T);
  if (started) { updateHud(L.clock, dt); drawMini(T); }
  if (AU.ctx && AU.on && started) {
    AU.acc += Math.min(engagedCount, 10) * dt * 0.8;
    while (AU.acc > 1) { AU.acc -= 1; pop(); }
    AU.wind.gain.value = 0.05 + envC.mist * 0.1;
  }
  renderer.render(scene, camera);
}

window.__sk = { seek: t => { seek(t); setPlaying(false); }, play: () => setPlaying(true) };
function init() {
  const t0 = performance.now();
  buildHeights();
  groundCanvas = buildGroundCanvas();
  buildTerrain(); buildTrees(); buildHouses(); buildMini(); buildTimeline();
  onResize();
  console.log('[sekigahara] built in', Math.round(performance.now() - t0), 'ms; soldiers', SOL);
  $('#load').textContent = '準備完了';
  $('#goSnd').disabled = $('#goMute').disabled = false;
  requestAnimationFrame(frame);
}
setTimeout(init, 60);
</script>
